openapi: 3.0.3
info:
  title: Gyroscope Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for 3-Axis MEMS Gyroscope entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Geroscope entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Geroscope'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Geroscope:g1"
              type: "Geroscope"
              name:
                type: "Property"
                value: "Sense HAT B 3-Axis Gyroscope"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Gyro:3001"
                  - "urn:ngsi-ld:Observation:Gyro:3002"
              axes:
                type: "Property"
                value:
                  value: 3
                  unitCode: ""
              measurementRanges:
                type: "Property"
                value:
                  value: [16, 32, 64, 128, 512, 1024, 2048]
                  unitCode: "DEG/S"
              resolution:
                type: "Property"
                value:
                  value: 16
                  unitCode: "bit"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Geroscope:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this gyroscope entity
            type:
              type: string
              enum:
                - Geroscope
              description: NGSI-LD entity type. Must be Geroscope
            axes:
              type: object
              description: Number of rotation axes
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - ""
              additionalProperties: false
            measurementRanges:
              type: object
              description: Supported angular-rate measurement ranges
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum:
                    - DEG/S
              additionalProperties: false
            resolution:
              type: object
              description: ADC conversion resolution
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: The Sense HAT B board this gyroscope module belongs to
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            observations:
              type: object
              description: Observation entities produced by this gyroscope
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Geroscope of Hydropower Plant Modeling
