openapi: 3.0.3
info:
  title: Ammonia Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for AmmoniaSensor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an AmmoniaSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/AmmoniaSensor"
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:AmmoniaSensor:001"
              type: "AmmoniaSensor"
              name:
                type: Property
                value: "River Ammonia Probe #1"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: Property
                value: sensor
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:Ammonia:7001"
              model:
                type: Property
                value: "Modified ion selective membrane"
              ionsType:
                type: Property
                value: "NH4"
              rangeMin:
                type: Property
                value: 15
                unitCode:
                  type: Property
                  value: "PPB"
              rangeMax:
                type: Property
                value: 150
                unitCode:
                  type: Property
                  value: "PPM"
              resolution:
                type: Property
                value: 1
                unitCode:
                  type: Property
                  value: "PPB"
              reactionTime:
                type: Property
                value: "<1 min"
              accuracy:
                type: Property
                value: "<±3 %"
                atTemperature:
                  type: Property
                  value: 20
                  unitCode:
                    type: Property
                    value: "CEL"
              powerSupply:
                type: Property
                value: 24
                unitCode:
                  type: Property
                  value: "V"
              powerDissipation:
                type: Property
                value: 1
                unitCode:
                  type: Property
                  value: "W"
              communicationMode:
                type: Property
                value: "RS485 (Modbus RTU)"
              cableLength:
                type: Property
                value: 5
                unitCode:
                  type: Property
                  value: "MTR"
              dimensionsLength:
                type: Property
                value: 250
                unitCode:
                  type: Property
                  value: "MMT"
              dimensionsDiameter:
                type: Property
                value: 30
                unitCode:
                  type: Property
                  value: "MMT"
              housingMaterial:
                type: Property
                value: "Stainless Steel + PVC"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        "201":
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    AmmoniaSensor:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            type:
              type: string
              enum:
                - AmmoniaSensor
              description: NGSI-LD entity type. Must be AmmoniaSensor
            model:
              type: string
              description: Sensor model or sensing principle
            ionsType:
              type: string
              description: Target ion species
            rangeMin:
              type: object
              description: Lower bound of the measurement range
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - PPB
              additionalProperties: false
            rangeMax:
              type: object
              description: Upper bound of the measurement range
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - PPM
              additionalProperties: false
            resolution:
              type: object
              description: Smallest detectable concentration increment
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - PPB
              additionalProperties: false
            reactionTime:
              type: string
              description: Time to reach 90% of final reading
            accuracy:
              type: object
              description: Maximum deviation under standard conditions
              properties:
                value:
                  type: string
                atTemperature:
                  type: object
                  description: Temperature at which accuracy is specified
                  properties:
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - CEL
                  additionalProperties: false
              additionalProperties: false
            powerSupply:
              type: object
              description: Nominal DC supply voltage
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerDissipation:
              type: object
              description: Maximum power consumption
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - W
              additionalProperties: false
            communicationMode:
              type: string
              description: Digital interface protocol
            cableLength:
              type: object
              description: Standard probe cable length
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MTR
              additionalProperties: false
            dimensionsLength:
              type: object
              description: Probe body length
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            dimensionsDiameter:
              type: object
              description: Probe body diameter
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            housingMaterial:
              type: string
              description: Wetted-part construction material
            isComponentOf:
              type: object
              description: Reference to the host MPG-6099 multi-parameter node
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of AmmoniaSensor of Hydropower Plant Modeling
