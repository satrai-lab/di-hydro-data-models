openapi: 3.0.3
info:
  title: EcoliBioSensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for E.coli biosensor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an EcoliBioSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/EcoliBioSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:EcoliBioSensor:01"
              type: "EcoliBioSensor"

              name:
                type: "Property"
                value: "E.coli Biosensor #1"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "sensor"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Ecoli:7001"

              measureRangeMin:
                type: "Property"
                value: 1
                unitCode:
                  type: "Property"
                  value: "CFU_ML"
              measureRangeMax:
                type: "Property"
                value: 5
                unitCode:
                  type: "Property"
                  value: "CFU_ML"
              measurementTime:
                type: "Property"
                value: "20 min incubation"
              accuracy:
                type: "Property"
                value: "< ±20 %"
              sizeLength:
                type: "Property"
                value: 20
                unitCode:
                  type: "Property"
                  value: "MMT"
              sizeWidth:
                type: "Property"
                value: 35
                unitCode:
                  type: "Property"
                  value: "MMT"
              material:
                type: "Property"
                value: "Gold + PVC"
              limitOfDetection:
                type: "Property"
                value: "1 CFU/mL"
              specificity:
                type: "Property"
                value: "No positive response"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false
           
    EcoliBioSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - EcoliBioSensor
              description: NGSI-LD entity type. Must be EcoliBioSensor
            measureRangeMin:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CFU_ML]
            measureRangeMax:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CFU_ML]
            measurementTime:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            accuracy:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            sizeLength:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MMT]
            sizeWidth:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MMT]
            material:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            limitOfDetection:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            specificity:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            isComponentOf:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of EcoliBioSensor of Hydropower Plant Modeling
