openapi: 3.0.3
info:
  title: Ultrasonic Generator Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Ultrasonic Generator entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an UltrasonicGenerator entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/UltrasonicGenerator'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:UltrasonicGenerator:001"
              type: "UltrasonicGenerator"
              name:
                type: "Property"
                value: "USG-4X2024 Ultrasonic Generator"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroTurbine:Penstock:01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "actuator"
              status:
                type: "Property"
                value: "active"
              model:
                type: "Property"
                value: "USG-4X2024"
              manufacturer:
                type: "Property"
                value: "SonicTech Instruments"
              numberOfChannels:
                type: "Property"
                value: 4
              outputVoltage:
                type: "Property"
                value: 12
                unitCode:
                  type: "Property"
                  value: "V"
              signalFrequencyMin:
                type: "Property"
                value: 20
                unitCode:
                  type: "Property"
                  value: "kHz"
              signalFrequencyMax:
                type: "Property"
                value: 40
                unitCode:
                  type: "Property"
                  value: "kHz"
              pulseControl:
                type: "Property"
                value: "modulated"
              powerSupplyVoltage:
                type: "Property"
                value: 220
                unitCode:
                  type: "Property"
                  value: "V"
              powerSupplyFrequency:
                type: "Property"
                value: 50
                unitCode:
                  type: "Property"
                  value: "Hz"
              dimensions:
                type: "Property"
                value:
                  - 300
                  - 200
                  - 100
                unitCode:
                  type: "Property"
                  value: "MMT"
              weight:
                type: "Property"
                value: 2.5
                unitCode:
                  type: "Property"
                  value: "KGM"
              controls:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:UltrasonicTransducer:TX-01"
                  - "urn:ngsi-ld:UltrasonicTransducer:TX-02"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
        onObject:
          type: object
          description: Component(s) this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        inHPP:
          type: object
          description: HydropowerPlant this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        deviceType:
          type: object
          description: Indicates sensor, actuator, or both
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
      additionalProperties: false

    UltrasonicGenerator:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UltrasonicGenerator
              description: NGSI-LD entity type. Must be UltrasonicGenerator
            status:
              type: string
              description: Operational status
            model:
              type: string
              description: Device model
            manufacturer:
              type: string
              description: Manufacturer name
            numberOfChannels:
              type: integer
              description: Number of output channels
            outputVoltage:
              type: object
              description: Peak output voltage
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            signalFrequencyMin:
              type: object
              description: Minimum generated frequency
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - kHz
              additionalProperties: false
            signalFrequencyMax:
              type: object
              description: Maximum generated frequency
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - kHz
              additionalProperties: false
            pulseControl:
              type: string
              description: Signal emission mode
            powerSupplyVoltage:
              type: object
              description: AC input voltage
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerSupplyFrequency:
              type: object
              description: AC line frequency
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - Hz
              additionalProperties: false
            dimensions:
              type: object
              description: Envelope dimensions [length, width, height]
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            weight:
              type: object
              description: Mass of the generator
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - KGM
              additionalProperties: false
            controls:
              type: object
              description: References to ultrasonic transducer entities driven by this generator
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of UltrasonicGenerator of Hydropower Plant Modeling
