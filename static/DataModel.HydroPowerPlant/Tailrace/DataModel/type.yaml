components:
  schemas:

    Tailrace:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/Tailrace/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/GenericStaticComponent/DataModel/type.yaml#/components/schemas/GenericStaticComponent"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this Tailrace component"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - Tailrace
              description: "NGSI-LD entity type. Must be Tailrace"
              x-ngsi:
                type: Property

            length:
              type: object
              description: "Channel length in meters"
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M]
              x-ngsi:
                type: Property
              additionalProperties: false

            waterLevel:
              type: object
              description: "Current water level at the tailrace (m)"
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M]
              x-ngsi:
                type: Property
              additionalProperties: false

            flowRate:
              type: object
              description: "Discharge rate at the tailrace outlet (m³/s)"
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MQS]  # UN/CEFACT code for cubic meter per second
              x-ngsi:
                type: Property
              additionalProperties: false

            connectsToWaterBody:
              type: object
              description: "Points to a downstream river, lake, or reservoir"
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: string
                  format: uri
              x-ngsi:
                type: Relationship
              additionalProperties: false

            receivesFromDraftTube:
              type: object
              description: "Indicates which draft tube(s) feed this tailrace"
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: string
                  format: uri
              x-ngsi:
                type: Relationship
              additionalProperties: false

          additionalProperties: false
