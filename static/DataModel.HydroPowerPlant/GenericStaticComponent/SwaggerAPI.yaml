openapi: 3.0.3
info:
  title: GenericStaticComponent Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for GenericStaticComponent entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a GenericStaticComponent entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/GenericStaticComponent"
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:GenericStaticComponent:comp1"
              type: "GenericStaticComponent"
              name:
                type: "Property"
                value: "Generic Static Component"
              status:
                type: "Property"
                value: "normal"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.49, 47.33]
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              hasDevices:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Sensor:support-vibration-sensor1"
                  - "urn:ngsi-ld:Meter:load-distribution-meter1"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:obs123"
              actuations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Actuation:actuator456"
      responses:
        "201":
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier for the component

        type:
          type: string
          enum:
            - GenericStaticComponent
          description: Fixed entity type identifier

        name:
          type: object
          description: Name of the component
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              description: Component name

        status:
          type: object
          description: The status of the device (e.g. if it functions normally or is under maintenance)
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string

        geographicalLocation:
          type: object
          description: GeoJSON Point of the component’s location (longitude, latitude)
          properties:
            type:
              type: string
              enum:
                - GeoProperty
            value:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - Point
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2

        isPartOfHydroPowerPlant:
          type: object
          description: Reference to the parent HydropowerPlant entity
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri

        hasDevices:
          type: object
          description: References to sensors or meters associated with the component
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri

        observations:
          type: object
          description: References to Observation entities from linked devices
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri

        actuations:
          type: object
          description: References to Actuation entities (e.g., control commands)
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
