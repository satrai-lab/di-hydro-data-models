components:
  schemas:

    UltrasonicGenerator:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/UltrasonicGenerator/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this ultrasonic generator entity"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - UltrasonicGenerator
              description: "NGSI-LD entity type. Must be UltrasonicGenerator"
              x-ngsi:
                type: Property

            status:
              type: string
              description: "Operational status"
              x-ngsi:
                type: Property

            model:
              type: string
              description: "Device model"
              x-ngsi:
                type: Property

            manufacturer:
              type: string
              description: "Manufacturer"
              x-ngsi:
                type: Property

            numberOfChannels:
              type: object
              description: "Number of output channels"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: integer
              x-ngsi:
                type: Property
              additionalProperties: false

            outputVoltage:
              type: object
              description: "Output voltage"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ V ]
                  description: "Volt"
              x-ngsi:
                type: Property
              additionalProperties: false

            signalFrequencyMin:
              type: object
              description: "Minimum generated frequency"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ kHz ]
                  description: "Kilohertz"
              x-ngsi:
                type: Property
              additionalProperties: false

            signalFrequencyMax:
              type: object
              description: "Maximum generated frequency"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ kHz ]
                  description: "Kilohertz"
              x-ngsi:
                type: Property
              additionalProperties: false

            pulseControl:
              type: string
              description: "Signal mode (e.g., 'modulated', 'continuous')"
              x-ngsi:
                type: Property

            powerSupplyVoltage:
              type: object
              description: "AC input voltage"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ V ]
                  description: "Volt"
              x-ngsi:
                type: Property
              additionalProperties: false

            powerSupplyFrequency:
              type: object
              description: "AC line frequency"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ Hz ]
                  description: "Hertz"
              x-ngsi:
                type: Property
              additionalProperties: false

            dimensions:
              type: object
              description: "Physical size [length, width, height]"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: array
                  items:
                    type: number
                  minItems: 3
                  maxItems: 3
                unitCode:
                  type: string
                  enum: [ MMT ]
                  description: "Millimeter"
              x-ngsi:
                type: Property
              additionalProperties: false

            weight:
              type: object
              description: "Weight of the generator"
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ KGM ]
                  description: "Kilogram"
              x-ngsi:
                type: Property
              additionalProperties: false

          additionalProperties: false
