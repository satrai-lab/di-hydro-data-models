openapi: 3.0.3
info:
  title: HydroPowerCommunity Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a HydroPowerCommunity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/HydroPowerCommunity'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:HydroPowerCommunity:comm-alpine-001"
              type: "Community"
              name: { "type": "Property", "value": "Alpine Hydro Consortium" }
              region: { "type": "Property", "value": "Pacific Northwest" }
              establishedYear: { "type": "Property", "value": 1995 }
              totalInstalledCapacity: { "type": "Property", "value": 2450.5, "unitCode": "MW" }
              totalAnnualEnergyOutput: { "type": "Property", "value": 12500000000, "unitCode": "KWH" }
              governanceModel: { "type": "Property", "value": "Public-Private Partnership" }
              contactEmail: { "type": "Property", "value": "ops@alpinehydro.org" }
              websiteURL: { "type": "Property", "value": "https://alpinehydro.org" }
              hasHPP: { "type": "Relationship", "object": ["urn:ngsi-ld:HydropowerPlant:hpp-alpine-001"] }
      responses:
        '201':
          description: Entity created

components:
  schemas:
    HydroPowerCommunity:
      type: object
      required: [id, type, name]
      properties:
        "@context":
          type: string
          description: Context file defining vocabulary
          example: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
        id:
          type: string
          format: uri
          description: Unique URI identifier for the community
          example: "urn:ngsi-ld:HydroPowerCommunity:comm-alpine-001"
        type:
          type: string
          enum: ["Community"]
          description: Fixed entity type identifier
        name:
          type: object
          description: Official name of the organization
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
          example:
            type: "Property"
            value: "Alpine Hydro Consortium"
        region:
          type: object
          description: Geographic area covered by the community
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
          example:
            type: "Property"
            value: "Pacific Northwest"
        establishedYear:
          type: object
          description: Year the organization was founded
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: integer
          example:
            type: "Property"
            value: 1995
        totalInstalledCapacity:
          type: object
          description: Combined capacity of all plants in megawatts (MW)
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["MW"]
          example:
            type: "Property"
            value: 2450.5
            unitCode: "MW"
        totalAnnualEnergyOutput:
          type: object
          description: Total yearly energy production in kilowatt-hours (kWh)
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["KWH"]
          example:
            type: "Property"
            value: 12500000000
            unitCode: "KWH"
        governanceModel:
          type: object
          description: Organizational structure (e.g., cooperative, public utility)
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
          example:
            type: "Property"
            value: "Public-Private Partnership"
        contactEmail:
          type: object
          description: Primary contact email for administration
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
              format: email
          example:
            type: "Property"
            value: "ops@alpinehydro.org"
        websiteURL:
          type: object
          description: Official website URL
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
              format: uri
          example:
            type: "Property"
            value: "https://alpinehydro.org"
        hasHPP:
          type: object
          description: Links to HydropowerPlant entities
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:HydropowerPlant:hpp-alpine-001"]
