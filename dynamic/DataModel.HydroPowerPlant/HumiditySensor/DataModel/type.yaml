components:
  schemas:

    HumiditySensor:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/HumiditySensor/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique URI identifier of this humidity sensor"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - HumiditySensor
              description: "NGSI-LD entity type. Must be HumiditySensor"
              x-ngsi:
                type: Property

            measuringRangeMin:
              type: object
              description: "Minimum relative-humidity reading"
              properties:
                value:
                  type: number
                  description: "Lower bound of range"
                unitCode:
                  type: string
                  enum:
                    - "%RH"
                  description: "Unit code for percent relative humidity"
              x-ngsi:
                type: Property
              additionalProperties: false

            measuringRangeMax:
              type: object
              description: "Maximum relative-humidity reading"
              properties:
                value:
                  type: number
                  description: "Upper bound of range"
                unitCode:
                  type: string
                  enum:
                    - "%RH"
                  description: "Unit code for percent relative humidity"
              x-ngsi:
                type: Property
              additionalProperties: false

            accuracy:
              type: object
              description: "Maximum deviation from actual humidity"
              properties:
                value:
                  type: number
                  description: "Accuracy magnitude"
                unitCode:
                  type: string
                  enum:
                    - "%RH"
                  description: "Unit code for percent relative humidity"
              x-ngsi:
                type: Property
              additionalProperties: false

            resolution:
              type: object
              description: "ADC conversion granularity"
              properties:
                value:
                  type: integer
                  description: "Resolution in bits"
                unitCode:
                  type: string
                  enum:
                    - bit
                  description: "Unit code for bits"
              x-ngsi:
                type: Property
              additionalProperties: false

            isComponentOf:
              type: array
              description: "The Sense HAT B board this sensor belongs to"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
