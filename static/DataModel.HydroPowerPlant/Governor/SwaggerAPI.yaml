openapi: 3.0.3
info:
  title: Governor NGSI-LD API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Governor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Governor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Governor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Governor:gov1"
              type: "Governor"
              name:
                type: "Property"
                value: "Main Speed Governor"
              droopSetting:
                type: "Property"
                value: 5
                unitCode: "PCT"
              speedSetPoint:
                type: "Property"
                value: 500
                unitCode: "RPM"
              regulationRange:
                type: "Property"
                value: 10
                unitCode: "PCT"
              responseTime:
                type: "Property"
                value: 0.5
                unitCode: "S"
              manufacturer:
                type: "Property"
                value: "ControlTech Ltd"
              yearOfInstallation:
                type: "Property"
                value: 2017
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              controlsTurbine:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Turbine:turb1"
              isPartOfPowerHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PowerHouse:ph1"
      responses:
        '201':
          description: Entity created successfully
components:
  schemas:
    Governor:
      type: object
      required:
        - "@context"
        - id
        - type
        - name
      properties:

        "@context":
          type: string
          description: Context file defining vocabulary
          example: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"

        id:
          type: string
          format: uri
          description: Unique URI identifier for the Governor
          example: "urn:ngsi-ld:Governor:gov1"

        type:
          type: string
          enum:
            - Governor
          description: Fixed entity type identifier
          example: "Governor"

        name:
          type: object
          description: Official or common name of the Governor
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          example:
            type: "Property"
            value: "Main Speed Governor"
        droopSetting:
          type: object
          description: Droop setting percentage indicating speed drop as load increases
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - PCT
          example: 
            type: "Property"
            value: 5
            unitCode: "PCT"
        speedSetPoint:
          type: object
          description: Target operating speed of the turbine
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - RPM
          example: 
            type: "Property"
            value: 500
            unitCode: "RPM"
        regulationRange:
          type: object
          description: Range over which the governor can adjust turbine input
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - PCT
          example: 
            type: "Property"
            value: 10
            unitCode: "PCT"
        responseTime:
          type: object
          description: Time it takes for the governor to react to changes (in seconds)
          properties:
            value:
              type: number
            unitCode:
              type: string
              enum:
                - S
          example:
            value: 0.5
            unitCode: "S"

        manufacturer:
          type: object
          description: Name or details of the governor’s manufacturer
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          example:
            type: "Property"
            value: "ControlTech Ltd"

        yearOfInstallation:
          type: object
          description: Year the governor was installed
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: integer
          example:
            type: "Property"
            value: 2017

        isPartOfHydroPowerPlant:
          type: object
          description: Relationship to parent HydropowerPlant entity
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
                - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"

        controlsTurbine:
          type: object
          description: Relationship to Turbine entities controlled by this governor
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
                - "urn:ngsi-ld:Turbine:turb1"

        isPartOfPowerHouse:
          type: object
          description: Relationship to the PowerHouse entity housing this governor
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
                - "urn:ngsi-ld:PowerHouse:ph1"
