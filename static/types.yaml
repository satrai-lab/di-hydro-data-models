---
components:
  schemas:

    HydropowerPlant:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the Hydropower Plant"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - HydropowerPlant
          description: "NGSI Entity type. It has to be HydropowerPlant"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The name of the Hydropower Plant"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the hydropower plant’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty
        address:
          type: string
          description: "Address of the Hydropower Plant"
          x-ngsi:
            type: Property
        size:
          type: object
          description: "Electric capacity category with range interval and standard information."
          properties:
            category:
              type: string
              enum:
                - Pico
                - Micro
                - Mini
                - Small
                - Medium
                - Large
              description: "Capacity category (e.g., Pico, Micro, Mini, Small, Medium, Large)."
            interval:
              type: object
              description: "The capacity range for the category (in MW)."
              properties:
                min:
                  type: object
                  description: "Minimum capacity value in MW."
                  properties:
                    value:
                      type: number
                      description: "Minimum capacity"
                    unitCode:
                      type: string
                      enum:
                        - "MW"
                      description: "UN/CEFACT unit code for megawatt"
                max:
                  type: object
                  description: "Maximum capacity value in MW."
                  properties:
                    value:
                      type: number
                      description: "Maximum capacity"
                    unitCode:
                      type: string
                      enum:
                        - "MW"
                      description: "UN/CEFACT unit code for megawatt"
            standard:
              type: string
              description: "The standard used to define the capacity range (e.g., 'Swedish' for below 1.5 MW, 'Chinese' for below 50 MW)."
          x-ngsi:
            type: Property
        powerPlantCapacity:
          type: object
          description: "The power production capacity of the plant (in MW)"
          properties:
            value:
              type: number
              description: "Capacity value in megawatts"
            unitCode:
              type: string
              enum:
                - "MW"
              description: "UN/CEFACT unit code for megawatt"
          x-ngsi:
            type: Property
        powerplantType:
          type: string
          description: "Type of hydropower plant (e.g., storage/reservoir, Run-of-River, pumped storage, in-stream)"
          x-ngsi:
            type: Property
        conversionEfficiency:
          type: number
          description: "Conversion efficiency percentage (typically 90-95%)"
          x-ngsi:
            type: Property
        averageWaterFlow:
          type: object
          description: "Average historical water flow (in cubic meters per second)"
          properties:
            value:
              type: number
              description: "Average water flow value"
            unitCode:
              type: string
              enum:
                - "M3S"
              description: "UN/CEFACT unit code for cubic meters per second"
          x-ngsi:
            type: Property
  

        hasHydroPumps:
          type: array
          description: "Array of HydroPump entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        # hasReservoir:
        #   type: array
        #   description: "Array of Reservoir entity identifiers"
        #   items:
        #     type: string
        #     format: uri
        #   x-ngsi:
        #     type: Relationship
    
        hasDams:
          type: array
          description: "Array of Dam entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        containsGenerators:
          type: array
          description: "Array of Generator entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasGovernors:
          type: array
          description: "Array of Governor entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        containsTurbines:
          type: array
          description: "Array of Turbine entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasIntakes:
          type: array
          description: "Array of Intake entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasPowerHouses:
          type: array
          description: "Array of PowerHouse entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasPenstocks:
          type: array
          description: "Array of Penstock entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasValve:
          type: array
          description: "Array of Valve entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasValveHouse:
          type: array
          description: "Array of ValveHouse entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasWaterBody:
          type: array
          description: "Array of WaterBody entity identifiers (river, lake, or reservoir)"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        hasSurgeTank:
          type: array
          description: "Array of SurgeTank entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

    CatchmentArea:
      required:
        - id
        - type
      properties:
        id:
          anyOf: *anyof
          format: uri
          type: string
          description: "Unique identifier of the WaterBody"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - CatchmentArea
          description: "NGSI Entity type. It has to be CatchmentArea"
          x-ngsi:
            type: Property
        area:
          type: object
          description: "The total area of the catchment in square kilometers"
          properties:
            value:
              type: number
              description: "Area value"
            unitCode:
              type: string
              enum:
                - "KM2"
              description: "UN/CEFACT unit code for square kilometer"
          x-ngsi:
            type: Property
        annualPrecipitationVolume:
          type: object
          description: "The total volume of rainfall collected annually in the catchment area (in cubic meters)"
          properties:
            value:
              type: number
              description: "Annual precipitation volume value"
            unitCode:
              type: string
              enum:
                - "M3"
              description: "UN/CEFACT unit code for cubic meter"
          x-ngsi:
            type: Property
        seasonalRainfallDistribution:
          type: object
          description: "Breakdown of how the annual precipitation is distributed across different seasons"
          x-ngsi:
            type: Property
        soilType:
          type: string
          description: "Classification of soil in the catchment area"
          x-ngsi:
            type: Property
        vegetationCover:
          type: string
          description: "Information on the types and extent of vegetation in the catchment"
          x-ngsi:
            type: Property
        flowVariationProfile:
          type: object
          description: "Data describing how water flow varies throughout the year"
          x-ngsi:
            type: Property
        suppliesWaterToWaterBody:
          type: array
          description: "Array of references to Water Body entities that are supplied by this catchment area"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        suppliesWaterToHydroPowerPlant:
          type: array
          description: "Array of references to HydropowerPlant entities that are supplied by this catchment area"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

    WaterBody:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the WaterBody"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - WaterBody
          description: "NGSI Entity type. It has to be WaterBody"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The name of the WaterBody"
          x-ngsi:
            type: Property
        waterBodyCategory:
          type: string
          enum:
            - River
            - Lake
            - Reservoir
            - Other
          description: "Indicates whether the water body is a River, Lake, Reservoir, or Other"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the water body’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty
        dimensions:
          type: object
          description: "Physical dimensions of the water body. Note: Not all nested properties may be applicable to every type of water body."
          anyOf:
            - type: object
              properties:
                surfaceArea:
                  type: object
                  description: "Surface area of the water body"
                  properties:
                    value:
                      type: number
                      description: "Surface area value"
                    unitCode:
                      type: string
                      enum:
                        - "KM2"
                      description: "UN/CEFACT unit code for square kilometer"
                length:
                  type: object
                  description: "Length of the water body (applicable for rivers or elongated lakes)"
                  properties:
                    value:
                      type: number
                      description: "Length value"
                    unitCode:
                      type: string
                      enum:
                        - "KM"
                      description: "UN/CEFACT unit code for kilometer"
                averageDepth:
                  type: object
                  description: "Average depth of the water body"
                  properties:
                    value:
                      type: number
                      description: "Depth value in meters"
                    unitCode:
                      type: string
                      enum:
                        - "M"
                      description: "UN/CEFACT unit code for meter"
              required:
                - surfaceArea
                - length
                - averageDepth
            - type: object
              properties:
                surfaceArea:
                  type: object
                  description: "Surface area of the water body"
                  properties:
                    value:
                      type: number
                      description: "Surface area value"
                    unitCode:
                      type: string
                      enum:
                        - "KM2"
                      description: "UN/CEFACT unit code for square kilometer"
                averageDepth:
                  type: object
                  description: "Average depth of the water body"
                  properties:
                    value:
                      type: number
                      description: "Depth value in meters"
                    unitCode:
                      type: string
                      enum:
                        - "M"
                      description: "UN/CEFACT unit code for meter"
              required:
                - surfaceArea
                - averageDepth
          x-ngsi:
            type: Property
        waterFlowCharacteristics:
          type: object
          description: "Flow characteristics of the water body"
          properties:
            averageFlowRate:
              type: object
              description: "Average flow rate"
              properties:
                value:
                  type: number
                  description: "Average flow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
            peakFlow:
              type: object
              description: "Peak flow rate"
              properties:
                value:
                  type: number
                  description: "Peak flow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
            seasonalVariation:
              type: object
              description: "Seasonal flow variation details"
              properties:
                winter:
                  type: object
                  properties:
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
                spring:
                  type: object
                  properties:
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
                summer:
                  type: object
                  properties:
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
                autumn:
                  type: object
                  properties:
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
          x-ngsi:
            type: Property
        waterLevel:
          type: object
          description: "Water level data"
          properties:
            averageLevel:
              type: object
              description: "Average water level"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "M"
          x-ngsi:
            type: Property
        waterQuality:
          type: object
          description: "Key water quality parameters"
          properties:
            temperature:
              type: object
              description: "Water temperature"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "C"
                  description: "UN/CEFACT unit code for Celsius"
            pH:
              type: number
              description: "pH level"
            dissolvedOxygen:
              type: object
              description: "Dissolved oxygen level"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "MG/L"
                  description: "UN/CEFACT unit code for milligrams per liter"
            sedimentLoad:
              type: object
              description: "Sediment load"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "MG/L"
                  description: "UN/CEFACT unit code for milligrams per liter"
          x-ngsi:
            type: Property
        environmentalIndicators:
          type: object
          description: "Environmental and ecological indicators"
          properties:
            biodiversityIndex:
              type: number
              description: "Biodiversity index"
            invasiveSpeciesPresent:
              type: boolean
              description: "Indicator if invasive species are present"
          x-ngsi:
            type: Property
        operationalData:
          type: object
          description: "Operational data such as flood risk and water rights"
          properties:
            floodRisk:
              type: string
              enum:
                - "Low"
                - "Medium"
                - "High"
              description: "Flood risk classification (e.g., Low, Medium, High)"
            waterRights:
              type: string
              enum:
                - "Public"
                - "Private"
                - "Mixed"
              description: "Information on water rights or allocation"
          x-ngsi:
            type: Property
        isFedBy:
          type: array
          description: "Array of references to the CatchmentArea entities that feed this water body"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        isPartOfHydroPowerPlant:
          type: array
          description: "Array of references to the HydropowerPlant entities of which this water body is a part"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

    Reservoir:
      allOf:
        - $ref: "#/components/schemas/WaterBody"
        - type: object
          properties:
            storageCapacity:
              type: object
              description: "Total volume of water that can be stored (in cubic meters)"
              properties:
                value:
                  type: number
                  description: "Storage capacity value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            inflowCharacteristics:
              type: object
              description: "Details about the water inflow regulation"
              properties:
                averageInflowRate:
                  type: object
                  description: "Average inflow rate (in m³/s)"
                  properties:
                    value:
                      type: number
                      description: "Average inflow rate value"
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
                      description: "UN/CEFACT unit code for cubic meters per second"
                retentionTime:
                  type: object
                  description: "Retention time (e.g., in hours)"
                  properties:
                    value:
                      type: number
                      description: "Retention time value"
                    unitCode:
                      type: string
                      enum:
                        - "H"
                      description: "UN/CEFACT unit code for hour"
              x-ngsi:
                type: Property
            outflowControl:
              type: object
              description: "Data regarding controlled water release"
              properties:
                gateStatus:
                  type: string
                  description: "Status of the outflow control gates"
                averageOutflowRate:
                  type: object
                  description: "Average outflow rate (in m³/s)"
                  properties:
                    value:
                      type: number
                      description: "Average outflow rate value"
                    unitCode:
                      type: string
                      enum:
                        - "M3S"
                      description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            operationalData:
              type: object
              description: "Operational data such as historical water level management"
              properties:
                historicalMaxLevel:
                  type: object
                  description: "Historical maximum water level (in meters)"
                  properties:
                    value:
                      type: number
                      description: "Historical maximum water level value"
                    unitCode:
                      type: string
                      enum:
                        - "M"
                      description: "UN/CEFACT unit code for meter"
                historicalMinLevel:
                  type: object
                  description: "Historical minimum water level (in meters)"
                  properties:
                    value:
                      type: number
                      description: "Historical minimum water level value"
                    unitCode:
                      type: string
                      enum:
                        - "M"
                      description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            hasDams:
              type: array
              description: "Array of references to the dams of the reservoir"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            feedsIntakes:
              type: array
              description: "Array of references to the intakes that the reservoir feeds"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

    Dam:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the Dam"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - Dam
          description: "NGSI Entity type. It has to be Dam"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The official or common name of the Dam"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the dam’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty

        damHeight:
          type: object
          description: "The vertical height from the dam’s foundation to its crest"
          properties:
            value:
              type: number
              description: "Height value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        damLength:
          type: object
          description: "The horizontal span or width of the dam"
          properties:
            value:
              type: number
              description: "Length value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        constructionMaterials:
          type: string
          enum:
            - "Concrete"
            - "Earth-fill"
            - "Rock-fill"
            - "Masonry"
          description: "The primary materials used in constructing the dam (e.g., concrete, earth-fill)"
          x-ngsi:
            type: Property
        
        structuralDesignParameters:
          type: object
          description: "Contains the key parameter Structural Type which defines the dam’s design"
          properties:
            structuralType:
              type: string
              enum:
                - "Gravity Dam"
                - "Arch Dam"
                - "Embankment Dam"
              description: "Structural type of the dam design"
          x-ngsi:
            type: Property
        yearOfConstruction:
          type: number
          description: "The year the dam was built"
          x-ngsi:
            type: Property
        hasSpillway:
          type: array
          description: "Array of references to the Spillway entity that is part of the dam's design to safely release excess water"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        
        hasintakes:
          type: array
          description: "Array of references to the intake entities that is part of the dam"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        isPartOfReservoir:
          type: array
          description: "Array of references to the Reservoir entity that is supplied by this dam"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        isPartOfHydroPlant:
          type: array
          description: "Array of references to the HydropowerPlant entity that this dam is a component of"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"
            
    Spillway:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the Spillway"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - Spillway
          description: "NGSI Entity type. It has to be Spillway"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The official or common name of the Spillway"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the spillway’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty
        dischargeCapacity:
          type: object
          description: "The maximum water discharge capacity of the spillway."
          properties:
            value:
              type: number
              description: "Capacity value in cubic meters per second (m³/s)"
            unitCode:
              type: string
              enum:
                - "M3S"
              description: "UN/CEFACT unit code for cubic meters per second"
          x-ngsi:
            type: Property
        designFlowRate:
          type: object
          description: "The flow rate that the spillway is engineered to handle under normal operating conditions."
          properties:
            value:
              type: number
              description: "Flow rate in cubic meters per second (m³/s)"
            unitCode:
              type: string
              enum:
                - "M3S"
              description: "UN/CEFACT unit code for cubic meters per second"
          x-ngsi:
            type: Property
        spillwayType:
          type: string
          enum:
            - "Chute Spillway"
            - "Side-Channel Spillway"
            - "Fuse Plug Spillway"
          description: "The classification or design type of the spillway"
          x-ngsi:
            type: Property
        crestElevation:
          type: object
          description: "The elevation of the spillway's crest, which is critical for determining when it will begin to operate"
          properties:
            value:
              type: number
              description: "Crest elevation value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        spillwayClassification:
          type: string
