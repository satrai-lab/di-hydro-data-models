openapi: 3.0.3
info:
  title: WaterBody Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for WaterBody entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a WaterBody entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/WaterBody'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:WaterBody:river1"
              type: "WaterBody"
              name:
                type: "Property"
                value: "Alpine River"
              waterBodyCategory:
                type: "Property"
                value: "River"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates:
                    - -121.51
                    - 47.34
              surfaceArea:
                type: "Property"
                value: 15.2
                unitCode: "KM2"
              length:
                type: "Property"
                value: 120
                unitCode: "KM"
              averageDepth:
                type: "Property"
                value: 8.5
                unitCode: "M"
              averageFlowRate:
                type: "Property"
                value: 200
                unitCode: "M3S"
              peakFlow:
                type: "Property"
                value: 450
                unitCode: "M3S"
              seasonalVariation:
                type: "Property"
                value:
                  winter: 120
                  spring: 250
                  summer: 180
                  autumn: 160
              averageWaterLevel:
                type: "Property"
                value: 3.2
                unitCode: "M"
              operationalData:
                type: "Property"
                value:
                  floodRisk: "Medium"
                  waterRights: "Mixed"
              isFedBy:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:CatchmentArea:ca1"
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    WaterBody:
      type: object
      required:
        - id
        - type
        - name
      properties:
        "@context":
          type: string
          description: Context file defining vocabulary
          example: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"

        id:
          type: string
          format: uri
          description: Unique URI identifier for the WaterBody
          example: "urn:ngsi-ld:WaterBody:river1"

        type:
          type: string
          enum:
            - WaterBody
          description: Fixed entity type identifier
          example: "WaterBody"

        name:
          type: object
          description: Official or common name of the WaterBody
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          example:
            type: "Property"
            value: "Alpine River"

        waterBodyCategory:
          type: object
          description: Classification of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - River
                - Lake
                - Reservoir
                - Other
          example:
            type: "Property"
            value: "River"

        geographicalLocation:
          type: object
          description: GeoJSON Point representing the water body’s location (longitude, latitude)
          properties:
            type:
              type: string
              enum:
                - GeoProperty
            value:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - Point
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
          example:
            type: "GeoProperty"
            value:
              type: "Point"
              coordinates: [-121.51, 47.34]

        surfaceArea:
          type: object
          description: Surface area of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - KM2
          example:
            type: "Property"
            value: 15.2
            unitCode: "KM2"

        length:
          type: object
          description: Length of the water body (rivers or elongated lakes)
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - KM
          example:
            type: "Property"
            value: 120
            unitCode: "KM"

        averageDepth:
          type: object
          description: Average depth of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 8.5
            unitCode: "M"

        averageFlowRate:
          type: object
          description: Average flow rate of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 200
            unitCode: "M3S"

        peakFlow:
          type: object
          description: Peak flow rate of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 450
            unitCode: "M3S"

        seasonalVariation:
          type: object
          description: Seasonal flow variation details
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: object
              properties:
                winter:
                  type: number
                spring:
                  type: number
                summer:
                  type: number
                autumn:
                  type: number
          example:
            type: "Property"
            value:
              winter: 120
              spring: 250
              summer: 180
              autumn: 160

        averageWaterLevel:
          type: object
          description: Average water‐surface elevation
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 3.2
            unitCode: "M"

        operationalData:
          type: object
          description: Management data such as flood risk and water rights
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: object
              properties:
                floodRisk:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High
                waterRights:
                  type: string
                  enum:
                    - Public
                    - Private
                    - Mixed
          example:
            type: "Property"
            value:
              floodRisk: "Medium"
              waterRights: "Mixed"

        isFedBy:
          type: object
          description: References to upstream CatchmentArea entities
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:CatchmentArea:ca1"

        isPartOfHydroPowerPlant:
          type: object
          description: References to HydropowerPlant entities using this water body
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
