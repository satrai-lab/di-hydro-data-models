components:
  schemas:

    UltrasonicGenerator:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/UltrasonicGenerator/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            status:
              type: string
              description: "Operational status"
              x-ngsi:
                type: Property

            model:
              type: string
              description: "Device model"
              x-ngsi:
                type: Property

            manufacturer:
              type: string
              description: "Manufacturer name"
              x-ngsi:
                type: Property

            numberOfChannels:
              type: integer
              description: "Number of output channels"
              x-ngsi:
                type: Property

            outputVoltage:
              type: object
              description: "Peak output voltage"
              properties:
                value:
                  type: number
                  description: "Voltage magnitude"
                unitCode:
                  type: string
                  enum: [ V ]
              x-ngsi:
                type: Property
              additionalProperties: false

            signalFrequencyMin:
              type: object
              description: "Minimum generated frequency"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ kHz ]
              x-ngsi:
                type: Property
              additionalProperties: false

            signalFrequencyMax:
              type: object
              description: "Maximum generated frequency"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ kHz ]
              x-ngsi:
                type: Property
              additionalProperties: false

            pulseControl:
              type: string
              description: "Signal emission mode"
              x-ngsi:
                type: Property

            powerSupplyVoltage:
              type: object
              description: "AC input voltage"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ V ]
              x-ngsi:
                type: Property
              additionalProperties: false

            powerSupplyFrequency:
              type: object
              description: "AC line frequency"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ Hz ]
              x-ngsi:
                type: Property
              additionalProperties: false

            dimensions:
              type: object
              description: "Envelope dimensions [L,W,H]"
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum: [ MMT ]
              x-ngsi:
                type: Property
              additionalProperties: false

            weight:
              type: object
              description: "Mass of the generator"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [ KGM ]
              x-ngsi:
                type: Property
              additionalProperties: false

            controls:
              type: object
              description: "References to ultrasonic transducer entities driven by this generator"
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              x-ngsi:
                type: Relationship
              additionalProperties: false

          additionalProperties: false
