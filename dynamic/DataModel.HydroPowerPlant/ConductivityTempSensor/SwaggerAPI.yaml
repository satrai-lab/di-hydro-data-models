openapi: 3.0.3
info:
  title: Conductivity–Temperature Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for ConductivityTemperatureSensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a ConductivityTemperatureSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/ConductivityTemperatureSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:ConductivityTemperatureSensor:ct1"
              type: "ConductivityTemperatureSensor"
              name:
                type: Property
                value: "CT-Probe #1"
              onObject:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Pipe:pipe1"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: Property
                value: sensor
              controlledObservation:
                type: Property
                value:
                  - Temperature
                  - Conductivity
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:CondTemp:8001"
                  - "urn:ngsi-ld:Observation:CondTemp:8002"
              model:
                type: Property
                value: "BH-485-DD"
              conductivityRangeMin:
                type: Property
                value: 0
                unitCode:
                  type: Property
                  value: "USC"
              conductivityRangeMax:
                type: Property
                value: 2000
                unitCode:
                  type: Property
                  value: "USC"
              temperatureRangeMin:
                type: Property
                value: 0
                unitCode:
                  type: Property
                  value: "CEL"
              temperatureRangeMax:
                type: Property
                value: 50
                unitCode:
                  type: Property
                  value: "CEL"
              accuracyConductivity:
                type: Property
                value: "±20 USC"
              accuracyTemperature:
                type: Property
                value: "±0.5 CEL"
              reactionTime:
                type: Property
                value: "< 60 s"
              resolutionConductivity:
                type: Property
                value: "1 USC"
              resolutionTemperature:
                type: Property
                value: "0.1 CEL"
              powerSupplyMin:
                type: Property
                value: 9
                unitCode:
                  type: Property
                  value: "V"
              powerSupplyMax:
                type: Property
                value: 36
                unitCode:
                  type: Property
                  value: "V"
              communicationMode:
                type: Property
                value: "RS485 (Modbus RTU)"
              cableLength:
                type: Property
                value: 5
                unitCode:
                  type: Property
                  value: "MTR"
              sizeLength:
                type: Property
                value: 230
                unitCode:
                  type: Property
                  value: "MMT"
              sizeDiameter:
                type: Property
                value: 30
                unitCode:
                  type: Property
                  value: "MMT"
              housingMaterial:
                type: Property
                value: "Stainless Steel + PVC"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    ConductivityTemperatureSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - ConductivityTemperatureSensor
              description: Must be ConductivityTemperatureSensor
            model:
              type: string
              description: Manufacturer’s model number
            conductivityRangeMin:
              type: object
              description: Minimum electrical conductivity measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - USC
              additionalProperties: false
            conductivityRangeMax:
              type: object
              description: Maximum electrical conductivity measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - USC
              additionalProperties: false
            temperatureRangeMin:
              type: object
              description: Minimum temperature measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            temperatureRangeMax:
              type: object
              description: Maximum temperature measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            accuracyConductivity:
              type: object
              description: Conductivity measurement accuracy
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            accuracyTemperature:
              type: object
              description: Temperature measurement accuracy
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            reactionTime:
              type: object
              description: Time to reach 90% of final reading
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            resolutionConductivity:
              type: object
              description: Granularity of conductivity reading
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            resolutionTemperature:
              type: object
              description: Granularity of temperature reading
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            powerSupplyMin:
              type: object
              description: Minimum DC supply voltage
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerSupplyMax:
              type: object
              description: Maximum DC supply voltage
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            communicationMode:
              type: object
              description: Digital communication protocol
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            cableLength:
              type: object
              description: Standard cable length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MTR
              additionalProperties: false
            sizeLength:
              type: object
              description: Probe body length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            sizeDiameter:
              type: object
              description: Probe body diameter
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            housingMaterial:
              type: object
              description: Wetted-part construction material
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            isComponentOf:
              type: object
              description: Reference to the host MPG-6099 node
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of ConductivityTemperatureSensor of Hydropower Plant Modeling
