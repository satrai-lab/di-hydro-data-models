openapi: 3.0.3
info:
  title: DissolvedO2Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for DissolvedO2Sensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a DissolvedO2Sensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/DissolvedO2Sensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:DissolvedO2Sensor:001"
              type: "DissolvedO2Sensor"
              name:
                type: Property
                value: "River DO Probe #1"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: Property
                value: sensor
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:DO:9001"
              rangeO2Min:
                type: Property
                value:
                  value: 0
                  unitCode: "MG_L"
              rangeO2Max:
                type: Property
                value:
                  value: 20.0
                  unitCode: "MG_L"
              rangeTempMin:
                type: Property
                value:
                  value: 0
                  unitCode: "CEL"
              rangeTempMax:
                type: Property
                value:
                  value: 50
                  unitCode: "CEL"
              basicError:
                type: Property
                value:
                  value: 0.30
                  unitCode: "MG_L"
              reactionTime:
                type: Property
                value: "<60 s"
              resolutionO2:
                type: Property
                value:
                  value: 0.01
                  unitCode: "MG_L"
              resolutionTemp:
                type: Property
                value:
                  value: 0.1
                  unitCode: "CEL"
              powerSupply:
                type: Property
                value:
                  value: 24
                  unitCode: "V"
              powerDissipation:
                type: Property
                value:
                  value: 1
                  unitCode: "W"
              communicationMode:
                type: Property
                value: "RS485 (Modbus RTU)"
              cableLength:
                type: Property
                value:
                  value: 5
                  unitCode: "MTR"
              dimensionsLength:
                type: Property
                value:
                  value: 230
                  unitCode: "MMT"
              dimensionsDiameter:
                type: Property
                value:
                  value: 30
                  unitCode: "MMT"
              housingMaterial:
                type: Property
                value: "Stainless Steel + PVC"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    DissolvedO2Sensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - DissolvedO2Sensor
              description: NGSI-LD entity type. Must be DissolvedO2Sensor
            rangeO2Min:
              type: object
              description: Minimum dissolved-O₂ concentration
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MG_L
              additionalProperties: false
            rangeO2Max:
              type: object
              description: Maximum dissolved-O₂ concentration
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MG_L
              additionalProperties: false
            rangeTempMin:
              type: object
              description: Minimum temperature
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            rangeTempMax:
              type: object
              description: Maximum temperature
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            basicError:
              type: object
              description: Maximum measurement error for dissolved oxygen
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MG_L
              additionalProperties: false
            reactionTime:
              type: string
              description: Time to reach 90% of final reading
            resolutionO2:
              type: object
              description: Smallest detectable change in dissolved oxygen
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MG_L
              additionalProperties: false
            resolutionTemp:
              type: object
              description: Smallest detectable change in temperature
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            powerSupply:
              type: object
              description: Nominal DC supply voltage
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerDissipation:
              type: object
              description: Maximum power consumption
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - W
              additionalProperties: false
            communicationMode:
              type: string
              description: Digital interface protocol
            cableLength:
              type: object
              description: Standard probe cable length
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MTR
              additionalProperties: false
            dimensionsLength:
              type: object
              description: Probe body length
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            dimensionsDiameter:
              type: object
              description: Probe body diameter
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            housingMaterial:
              type: string
              description: Wetted-part construction material
            isComponentOf:
              type: object
              description: Reference to the host MPG-6099 multi-parameter node
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of DissolvedO2Sensor of Hydropower Plant Modeling
