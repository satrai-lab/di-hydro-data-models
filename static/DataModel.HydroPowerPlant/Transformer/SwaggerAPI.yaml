openapi: 3.0.3
info:
  title: Transformer Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Transformer entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Transformer entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Transformer'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Transformer:trans1"
              type: "Transformer"
              transformerSupplier:
                type: "Property"
                value: "PowerGear Inc."
              ratedPower:
                type: "Property"
                value: 500
                unitCode: 
                  type: "Property"
                  value: "MVA"
              regulationRange:
                type: "Property"
                value: "110kV/33kV"
                unitCode: 
                  type: "Property"
                  value: "KV"
              belongsToGenerator:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Generator:gen1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    Transformer:
      allOf: 
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          required:
            - id
            - type
          properties:
    
            id:
              type: string
              format: uri
              description: Unique URI identifier for the Transformer
    
            type:
              type: string
              enum:
                - Transformer
              description: Fixed entity type identifier
    
            transformerSupplier:
              type: object
              description: Manufacturer or supplier of the transformer
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
    
            ratedPower:
              type: object
              description: Nameplate apparent-power capacity under normal conditions
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MVA
    
            regulationRange:
              type: object
              description: Voltage conversion ratio (input kV/output kV)
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
                unitCode:
                  type: string
                  enum:
                    - KV
    
            belongsToGenerator:
              type: object
              description: Reference(s) to the Generator entity or entities this transformer serves
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
