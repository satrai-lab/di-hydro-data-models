components:
  schemas:

    Spillway:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/SpillWay/DataModel/type.json"
      allOf:
         - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/GenericStaticComponent/DataModel/type.yaml#/components/schemas/GenericStaticComponent"
         - type: object
           required:
             - id
             - type
             - name
           properties:
             id:
               description: "Property. Identifier format of any NGSI entity"
               maxLength: 256
               minLength: 1
               pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
               type: string
               format: uri
               type: string
               description: "Unique identifier of the Spillway"
               x-ngsi:
                 type: Property
             type:
               type: string
               enum:
                 - Spillway
               description: "NGSI Entity type. It has to be Spillway"
               x-ngsi:
                 type: Property
             name:
               type: string
               description: "The official or common name of the Spillway"
               x-ngsi:
                 type: Property
             geographicalLocation:
               type: object
               description: "GeoJSON property of type 'Point' representing the spillway’s location. The first element in coordinates is longitude, and the second is latitude."
               properties:
                 type:
                   type: string
                   enum:
                     - Point
                 coordinates:
                   type: array
                   items:
                     type: number
                   minItems: 2
               x-ngsi:
                 type: GeoProperty
             dischargeCapacity:
               type: object
               description: "The maximum water discharge capacity of the spillway."
               properties:
                 value:
                   type: number
                   description: "Capacity value in cubic meters per second (m³/s)"
                 unitCode:
                   type: string
                   enum:
                     - "M3S"
                   description: "UN/CEFACT unit code for cubic meters per second"
               x-ngsi:
                 type: Property
             designFlowRate:
               type: object
               description: "The flow rate that the spillway is engineered to handle under normal operating conditions."
               properties:
                 value:
                   type: number
                   description: "Flow rate in cubic meters per second (m³/s)"
                 unitCode:
                   type: string
                   enum:
                     - "M3S"
                   description: "UN/CEFACT unit code for cubic meters per second"
               x-ngsi:
                 type: Property
             spillwayType:
               type: string
               enum:
                 - "Chute Spillway"
                 - "Side-Channel Spillway"
                 - "Fuse Plug Spillway"
               description: "The classification or design type of the spillway"
               x-ngsi:
                 type: Property
             crestElevation:
               type: object
               description: "The elevation of the spillway's crest, which is critical for determining when it will begin to operate"
               properties:
                 value:
                   type: number
                   description: "Crest elevation value in meters"
                 unitCode:
                   type: string
                   enum:
                     - "M"
                   description: "UN/CEFACT unit code for meter"
               x-ngsi:
                 type: Property
             
             spillwayClassification:
               type: string
               enum:
                 - Principal
                 - Emergency
               description: "Indicates whether the spillway is a Principal Spillway (for regular operation) or an Emergency Spillway (for safety during extreme conditions)"
               x-ngsi:
                 type: Property
             isPartOfHydrPowerPlant:
               type: array
               description: "Array of references to HydropowerPlant entities that this HydroPump is a component of"
               items:
                 type: string
                 format: uri
               x-ngsi:
                type: Relationship

