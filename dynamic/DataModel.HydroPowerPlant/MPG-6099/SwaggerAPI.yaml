openapi: 3.0.3
info:
  title: MPG-6099 Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for MPG-6099 Multi-Parameter Analyser Node entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an MPG6099 entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/MPG6099'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:MPG6099:01"
              type: "MPG6099"
              name:
                type: Property
                value: "MPG-6099 Multi-Parameter Analyser Node"
              onObject:
                type: Relationship
                object: ["urn:ngsi-ld:Platform:PanelMount"]
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              controlledObservation:
                type: Property
                value: ["Conductivity","pH","Ammonia","Turbidity","Algae","DissolvedO2"]
              observations:
                type: Relationship
                object: ["urn:ngsi-ld:Observation:MPG:7001"]
              controlledActuation:
                type: Property
                value: []
              actuations:
                type: Relationship
                object: []
              deviceType:
                type: Property
                value: "sensorActuator"
              relativePosition:
                type: Property
                value: {"type":"Point","coordinates":[0,0,0]}
              display:
                type: Property
                value: "LCD"
                width:
                  type: Property
                  value: 7
                  unitCode:
                    type: Property
                    value: "inch"
              powerDC:
                type: Property
                value: 24
                unitCode:
                  type: Property
                  value: "V"
              powerAC:
                type: Property
                value: 220
                unitCode:
                  type: Property
                  value: "V"
              protection:
                type: Property
                value: "IP65"
              inputs:
                type: Property
                value: "RS-485 (Modbus RTU)"
              output:
                type: Property
                value: "RS-485 (Modbus RTU)"
              dataLogger:
                type: Property
                value: true
              downloadInterface:
                type: Property
                value: "USB"
              wirelessOption:
                type: Property
                value: true
              dimensions:
                type: Property
                value: [320, 270, 121]
                unitCode:
                  type: Property
                  value: "MMT"
              hasConductivityTempSensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:ConductivityTempSensor:ct1"
              hasPhTempSensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:PhTempSensor:ph1"
              hasAmmoniaSensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:AmmoniaSensor:am1"
              hasTurbiditySensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:TurbiditySensor:tb1"
              hasAlgaeSensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:AlgaeSensor:al1"
              hasDissolvedO2Sensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:DissolvedO2Sensor:do1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum: [ Property ]
            value:
              type: string
          additionalProperties: false
        onObject:
          type: object
          description: Component(s) of the HPP this device is installed on
          properties:
            type:
              type: string
              enum: [ Relationship ]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant this device belongs to
          properties:
            type:
              type: string
              enum: [ Relationship ]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum: [ Property ]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum: [ Relationship ]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum: [ Property ]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum: [ Relationship ]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [ Property ]
            value:
              type: string
              enum: [ sensor, actuator, sensorActuator, Device, System ]
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum: [ Point, LineString, MultiLineString, Polygon, Trimesh ]
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [ 2D, 3D ]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false
      additionalProperties: false

    MPG6099:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              description: Unique URI identifier of this MPG-6099 node
            type:
              type: string
              enum:
                - MPG6099
              description: NGSI-LD entity type. Must be MPG6099
            display:
              type: object
              description: Local display specification
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: string
                width:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ Property ]
                    value:
                      type: number
                    unitCode:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [ Property ]
                        value:
                          type: string
                          enum: [ inch ]
            powerDC:
              type: object
              description: Supported DC power supply
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ Property ]
                    value:
                      type: string
                      enum: [ V ]
            powerAC:
              type: object
              description: Supported AC power supply
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ Property ]
                    value:
                      type: string
                      enum: [ V ]
            protection:
              type: object
              description: Enclosure protection rating
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: string
            inputs:
              type: object
              description: Input communication interface
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: string
            output:
              type: object
              description: Output communication interface
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: string
            dataLogger:
              type: object
              description: Local data-logging capability
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: boolean
            downloadInterface:
              type: object
              description: Interface for data export and firmware updates
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: string
            wirelessOption:
              type: object
              description: Optional wireless modem availability
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: boolean
            dimensions:
              type: object
              description: Physical dimensions [length, width, height]
              properties:
                type:
                  type: string
                  enum: [ Property ]
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ Property ]
                    value:
                      type: string
                      enum: [ MMT ]
            hasConductivityTempSensor:
              type: object
              description: Reference to the conductivity/temperature sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasPhTempSensor:
              type: object
              description: Reference to the pH/temperature sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasAmmoniaSensor:
              type: object
              description: Reference to the ammonia sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasTurbiditySensor:
              type: object
              description: Reference to the turbidity sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasAlgaeSensor:
              type: object
              description: Reference to the algae sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasDissolvedO2Sensor:
              type: object
              description: Reference to the dissolved oxygen sensor module
              properties:
                type:
                  type: string
                  enum: [ Relationship ]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of MPG6099 of Hydropower Plant Modeling
