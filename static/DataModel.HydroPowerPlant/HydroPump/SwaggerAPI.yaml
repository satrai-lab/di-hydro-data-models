openapi: 3.0.3
info:
  title: HydroPump NGSI-LD API
  version: 1.0.0
  description: Direct API for hydro pump management without property wrappers
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a HydroPump
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/HydroPump'
            example:
              "@context": ["https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld",
              "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/context.json"]
              id: "urn:ngsi-ld:HydroPump:pump-001"
              type: "HydroPump"
              name: 
                type: Property
                value: "Alpine Pump Unit #5"
              pumpCapacity: 
                type: Property
                value: 300
                unitCode: 
                  type: Property
                  value: "MW"
              pumpEfficiency: 
                type: Property
                value: 82.5
                unitCode: 
                  type: Property
                  value: "PCT"
              operationalMode: 
                type: Property
                value: "Pumping"
              powerConsumption: 
                type: Property
                value: 275
                unitCode: 
                  type: Property
                  value: "MW"
              cycleTime:
                type: Property
                value: 4.5
                unitCode:
                  type: Property
                  value: "H"
              PumpWaterTo: 
                type: Relationship
                object: 
                  [ "urn:ngsi-ld:Reservoir:upper-basin",
                    "urn:ngsi-ld:Reservoir:backup-storage"]
              isPartOfHydrPowerPlant: 
                type: Relationship
                object: 
                  ["urn:ngsi-ld:HydropowerPlant:alpine-psp"]
      responses:
        '201':
          description: Pump entity created

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    HydroPump:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          
          required:
            - id
            - type
            - name
          properties:
            "@context":
              type: string
              example: ["https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld",
                "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/context.json"]
            id:
              type: string
              format: uri
            type:
              type: string
              enum: ["HydroPump"]
            name:
              type: string
            pumpCapacity:
              type: object
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["MW", "M3S"]
            pumpEfficiency:
              type: object
              properties:
                value:
                  type: number
                  minimum: 0
                  maximum: 100
                unitCode:
                  type: string
                  enum: ["PCT"]
            operationalMode:
              type: string
              enum: ["Pumping", "Generating"]
            powerConsumption:
              type: object
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["MW"]
            cycleTime:
              type: object
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["H"]
            PumpWaterTo:
              type: array
              items:
                type: string
                format: uri
            isPartOfHydrPowerPlant:
              type: array
              items:
                type: string
                format: uri
          
