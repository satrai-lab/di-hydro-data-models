openapi: 3.0.3
info:
  title: Digital pH–Temperature Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for DigitalPHTempSensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a DigitalPHTempSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/DigitalPHTempSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:DigitalPHTempSensor:001"
              type: "DigitalPHTempSensor"
              name:
                type: Property
                value: "BH-485 pH–Temp Probe #1"
              onObject:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Pipe:pipeA1"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: Property
                value: sensor
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:pH:7001"
                  - "urn:ngsi-ld:Observation:Temp:7002"
              model:
                type: Property
                value: "IOT-485-PH"
              pHRangeMin:
                type: Property
                value: 0.0
                unitCode:
                  type: Property
                  value: ""
              pHRangeMax:
                type: Property
                value: 14.0
                unitCode:
                  type: Property
                  value: ""
              temperatureRangeMin:
                type: Property
                value: 0.0
                unitCode:
                  type: Property
                  value: "CEL"
              temperatureRangeMax:
                type: Property
                value: 50.0
                unitCode:
                  type: Property
                  value: "CEL"
              accuracyPH:
                type: Property
                value: "±0.1 pH"
              accuracyTemperature:
                type: Property
                value: "±0.5 °C"
              resolutionPH:
                type: Property
                value: "0.01 pH"
              resolutionTemperature:
                type: Property
                value: "0.1 °C"
              powerSupplyMin:
                type: Property
                value: 9
                unitCode:
                  type: Property
                  value: "V"
              powerSupplyMax:
                type: Property
                value: 36
                unitCode:
                  type: Property
                  value: "V"
              powerDissipation:
                type: Property
                value: "1 W"
              communicationMode:
                type: Property
                value: "RS485 (Modbus RTU)"
              cableLength:
                type: Property
                value: 10
                unitCode:
                  type: Property
                  value: "MTR"
              dimensionsLength:
                type: Property
                value: 230
                unitCode:
                  type: Property
                  value: "MMT"
              dimensionsDiameter:
                type: Property
                value: 30
                unitCode:
                  type: Property
                  value: "MMT"
              housingMaterial:
                type: Property
                value: "Stainless Steel + ABS"
              protectionGrade:
                type: Property
                value: "IP68"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    DigitalPHTempSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - DigitalPHTempSensor
              description: Must be DigitalPHTempSensor
            model:
              type: string
              description: Manufacturer’s model number
            pHRangeMin:
              type: object
              description: Minimum pH measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - ""
              additionalProperties: false
            pHRangeMax:
              type: object
              description: Maximum pH measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - ""
              additionalProperties: false
            temperatureRangeMin:
              type: object
              description: Minimum temperature measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            temperatureRangeMax:
              type: object
              description: Maximum temperature measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            accuracyPH:
              type: object
              description: pH measurement accuracy
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            accuracyTemperature:
              type: object
              description: Temperature measurement accuracy
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            resolutionPH:
              type: object
              description: pH reading granularity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            resolutionTemperature:
              type: object
              description: Temperature reading granularity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            powerSupplyMin:
              type: object
              description: Minimum DC supply voltage
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerSupplyMax:
              type: object
              description: Maximum DC supply voltage
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            powerDissipation:
              type: object
              description: Typical power draw
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            communicationMode:
              type: object
              description: Digital communication protocol
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            cableLength:
              type: object
              description: Standard cable length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MTR
              additionalProperties: false
            dimensionsLength:
              type: object
              description: Probe body length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            dimensionsDiameter:
              type: object
              description: Probe body diameter
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            housingMaterial:
              type: object
              description: Wetted-part construction material
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            protectionGrade:
              type: object
              description: Ingress protection rating
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            isComponentOf:
              type: object
              description: Reference to the host MPG-6099 multi-parameter node
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of DigitalPHTempSensor of Hydropower Plant Modeling
