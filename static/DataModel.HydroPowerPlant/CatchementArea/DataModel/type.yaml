components:
  schemas:
    CatchmentArea:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/CatchementArea/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/GenericStaticComponent/DataModel/type.yaml#/components/schemas/GenericStaticComponent"
        - type: object
          required:
            - id
            - type
          properties:
            id:
              type: string
              format: uri
              description: "Unique identifier of the WaterBody"
              x-ngsi:
                type: Property
            type:
              type: string
              enum:
                - CatchmentArea
              description: "NGSI Entity type. It has to be CatchmentArea"
              x-ngsi:
                type: Property
            area:
              type: object
              description: "The total area of the catchment in square kilometers"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [KM2]
                  description: "UN/CEFACT unit code for square kilometer"
              x-ngsi:
                type: Property
            annualPrecipitationVolume:
              type: object
              description: "The total volume of rainfall collected annually in the catchment area (in cubic meters)"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M3]
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            seasonalRainfallDistribution:
              type: array
              description: >
                Distribution of annual rainfall across seasons as percentages. The array follows the order:
                [Spring, Summer, Autumn, Winter]
              items:
                type: number
              x-ngsi:
                type: Property
            soilType:
              type: string
              description: "Classification of soil in the catchment area"
              x-ngsi:
                type: Property
            vegetationCover:
              type: string
              description: "Information on the types and extent of vegetation in the catchment"
              x-ngsi:
                type: Property
            flowVariationProfile:
              type: array
              description: "Array of monthly water flow rates in m³/s: [Jan, Feb, ..., Dec]"
              items:
                type: object
                properties:
                  value:
                    type: number
                  unitCode:
                    type: string
                    enum: [M3S]
                    description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            averageWaterFlow:
              type: object
              description: "Average historical water flow (in cubic meters per second)"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M3S]
                  description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            suppliesWaterToWaterBody:
              type: array
              description: "Array of references to Water Body entities that are supplied by this catchment area"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            suppliesWaterToHydroPowerPlant:
              type: array
              description: "Array of references to HydropowerPlant entities that are supplied by this catchment area"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
