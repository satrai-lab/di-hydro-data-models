openapi: 3.0.3
info:
  title: AEPZTSensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for AEPZTSensor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an AEPZTSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/AEPZTSensor'
            example:
              "@context": https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json
              id: urn:ngsi-ld:AEPZTSensor:001
              type: AEPZTSensor

              # — Generic Device properties —
              name:
                type: Property
                value: AE PZT Sensor #1
              onObject:
                type: Relationship
                object:
                  - urn:ngsi-ld:AESystem:01
              inHPP:
                type: Relationship
                object: urn:ngsi-ld:HydropowerPlant:Plant-XYZ
              deviceType:
                type: Property
                value: sensor
              observations:
                type: Relationship
                object:
                  - urn:ngsi-ld:Observation:obs001

              # — AEPZTSensor-specific properties —
              monitoringType:
                type: Property
                value: StructuralHealthAndConditionMonitoring
              resonantFrequency:
                type: Property
                value: 150
                unitCode:
                  type: Property
                  value: kHz
              frequencyMin:
                type: Property
                value: 100
                unitCode:
                  type: Property
                  value: kHz
              frequencyMax:
                type: Property
                value: 200
                unitCode:
                  type: Property
                  value: kHz
              peakSensitivity:
                type: Property
                value: 120
                unitCode:
                  type: Property
                  value: dB
              temperatureMin:
                type: Property
                value: -20
                unitCode:
                  type: Property
                  value: CEL
              temperatureMax:
                type: Property
                value: 80
                unitCode:
                  type: Property
                  value: CEL
              preAmplifierImpedance:
                type: Property
                value: 1000
                unitCode:
                  type: Property
                  value: OHM
              integralPreAmplifierGain:
                type: Property
                value: 40
                unitCode:
                  type: Property
                  value: dB
              integralPreAmplifierSupplyVoltage:
                type: Property
                value: 28
                unitCode:
                  type: Property
                  value: V
              caseMaterial:
                type: Property
                value: stainless steel
              faceMaterial:
                type: Property
                value: ceramic
              length:
                type: Property
                value: 20
                unitCode:
                  type: Property
                  value: MMT
              width:
                type: Property
                value: 20
                unitCode:
                  type: Property
                  value: MMT
              isComponentOf:
                type: Relationship
                object:
                  - urn:ngsi-ld:AESystem:01

      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    AEPZTSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - AEPZTSensor
              description: Must be AEPZTSensor
            monitoringType:
              type: object
              description: Category of monitoring application
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                  enum:
                    - StructuralHealthAndConditionMonitoring
                    - EnvironmentalMonitoring
                    - BiodiversityMonitoring
            resonantFrequency:
              type: object
              description: Sensor resonant frequency
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [kHz]
              additionalProperties: false
            frequencyMin:
              type: object
              description: Minimum operational frequency
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [kHz]
              additionalProperties: false
            frequencyMax:
              type: object
              description: Maximum operational frequency
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [kHz]
              additionalProperties: false
            peakSensitivity:
              type: object
              description: Peak sensitivity level
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [dB]
              additionalProperties: false
            temperatureMin:
              type: object
              description: Minimum operating temperature
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CEL]
              additionalProperties: false
            temperatureMax:
              type: object
              description: Maximum operating temperature
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CEL]
              additionalProperties: false
            preAmplifierImpedance:
              type: object
              description: Input impedance of the pre-amplifier
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [OHM]
              additionalProperties: false
            integralPreAmplifierGain:
              type: object
              description: Gain of the built-in pre-amplifier
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [dB]
              additionalProperties: false
            integralPreAmplifierSupplyVoltage:
              type: object
              description: Supply voltage of the built-in pre-amplifier
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [V]
              additionalProperties: false
            caseMaterial:
              type: object
              description: Material of the sensor housing
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            faceMaterial:
              type: object
              description: Material of the sensor contact face
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            length:
              type: object
              description: Physical length of the sensor
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MMT]
              additionalProperties: false
            width:
              type: object
              description: Physical width of the sensor
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MMT]
              additionalProperties: false
            isComponentOf:
              type: object
              description: Reference(s) to the AE system entity that this sensor is part of
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of AEPZTSensor of Hydropower Plant Modeling
