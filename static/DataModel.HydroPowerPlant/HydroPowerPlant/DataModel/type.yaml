---
components:
  schemas:

      HydropowerPlant:
        required:
        - id
        - type
        - name
        properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the Hydropower Plant"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - HydropowerPlant
          description: "NGSI Entity type. It has to be HydropowerPlant"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The name of the Hydropower Plant"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the hydropower plant’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              x-ngsi:
                type: GeoProperty
        address:
          type: string
          description: "Address of the Hydropower Plant"
          x-ngsi:
            type: Property
        size:
          type: object
          description: "Electric capacity category with range interval and standard information."
          properties:
            value:
              type: string
              enum:
                - Pico
                - Micro
                - Mini
                - Small
                - Medium
                - Large
              description: "Capacity category (e.g., Pico, Micro, Mini, Small, Medium, Large)."
              min:
                  type: object
                  description: "Minimum capacity value in MW."
                  properties:
                    value:
                      type: number
                      description: "Minimum capacity"
                    unitCode:
                      type: string
                      enum:
                        - "MW"
                      description: "UN/CEFACT unit code for megawatt"
                  x-ngsi:
                    type: Property
              max:
                  type: object
                  description: "Maximum capacity value in MW."
                  properties:
                    value:
                      type: number
                      description: "Maximum capacity"
                    unitCode:
                      type: string
                      enum:
                        - "MW"
                      description: "UN/CEFACT unit code for megawatt"
                  x-ngsi:
                    type: Property
            standard:
              type: string
              description: "The standard used to define the capacity range (e.g., 'Swedish' for below 1.5 MW, 'Chinese' for below 50 MW)."
              x-ngsi:
                type: Property
          x-ngsi:
            type: Property
        powerPlantCapacity:
          type: object
          description: "The power production capacity of the plant (in MW)"
          properties:
            value:
              type: number
              description: "Capacity value in megawatts"
            unitCode:
              type: string
              enum:
                - "MW"
              description: "UN/CEFACT unit code for megawatt"
          x-ngsi:
            type: Property
        powerplantType:
          type: string
          description: "Type of hydropower plant (e.g., storage/reservoir, Run-of-River, pumped storage, in-stream)"
          x-ngsi:
            type: Property
        conversionEfficiency:
          type: number
          description: "Conversion efficiency percentage (typically 90-95%)"
          x-ngsi:
            type: Property
        commissioningYear:
          type: integer
          description: "The year when the plant first began operation"
          x-ngsi:
            type: Property
        rehabilitationYear:
          type: integer
          description: "The year of the most recent full rehabilitation of the plant"
          x-ngsi:
            type: Property
        installedCapacity:
          type: number
          description: "The plant’s total rated electrical capacity (MW)"
          x-ngsi:
            type: Property
          unitCode:
            type: string
            enum:
              - "MW"
            description: "UN/CEFACT unit code for megawatt"
        annualEnergyOutput:
          type: number
          description: "The average total energy the plant produces per year (kWh)"
          x-ngsi:
            type: Property
          unitCode:
            type: string
            enum:
              - "KWH"
            description: "UN/CEFACT unit code for kilowatt-hour"
        ecologicalDischarge:
          type: number
          description: "The minimum flow always released downstream to keep the river healthy (m³/s)"
          x-ngsi:
            type: Property
          unitCode:
            type: string
            enum:
              - "M3/S"
            description: "UN/CEFACT unit code for cubic meters per second"
        maxTailwaterLevel:
          type: number
          description: "Highest water‑surface elevation downstream of the turbines above mean sea level (m)"
          x-ngsi:
            type: Property
          unitCode:
            type: string
            enum:
              - "M"
            description: "UN/CEFACT unit code for meters"
        grossHead:
          type: number
          description: "Total vertical drop from reservoir water surface to turbine inlet before losses (m)"
          x-ngsi:
            type: Property
          unitCode:
            type: string
            enum:
              - "M"
            description: "UN/CEFACT unit code for meters"
        partOfCommunity:
          type: array
          items:
            type: string
            format: uri
          description: "Relationship to the Community entity"
          x-ngsi:
            type: Relationship
        hasPressureTunnel:
          type: array
          description: "Array of PressureTunnel entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        boostedByPumpingStation:
          type: array
          description: "Array of PumpingStation entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasHydroPumps:
          type: array
          description: "Array of HydroPump entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasDams:
          type: array
          description: "Array of Dam entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        containsGenerators:
          type: array
          description: "Array of Generator entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasGovernors:
          type: array
          description: "Array of Governor entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        containsTurbines:
          type: array
          description: "Array of Turbine entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasIntakes:
          type: array
          description: "Array of Intake entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasPowerHouses:
          type: array
          description: "Array of PowerHouse entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasPenstocks:
          type: array
          description: "Array of Penstock entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasValve:
          type: array
          description: "Array of Valve entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasValveHouse:
          type: array
          description: "Array of ValveHouse entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasWaterBody:
          type: array
          description: "Array of WaterBody entity identifiers (river, lake, or reservoir)"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasSurgeTank:
          type: array
          description: "Array of SurgeTank entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        hasSpillway:
          type: array
          description: "Array of SurgeTank entity identifiers"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/HydroPowerPlant/DataModel/type.json"
        
info:
  description: "Data Model of HydroPowerCommunity"
  title: HydropowerPlantModeling
  version: "1.0.2"
openapi: "3.0.3"
paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          content:
            application/ld+json:
              schema:
                type: object
          description: OK
