openapi: 3.0.3
info:
  title: Microcontroller Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Microcontroller entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Microcontroller entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Microcontroller'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Microcontroller:pi1"
              type: "Microcontroller"

              name:
                type: "Property"
                value: "Raspberry Pi 3B+ Controller"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroTurbine:PenstockValve-01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"

              microcontrollerType:
                type: "Property"
                value: "RaspberryPi"
              processor:
                type: "Property"
                value: "Broadcom BCM2837"
              memory:
                type: "Property"
                value: 1
                unitCode:
                  type: "Property"
                  value: "GBA"
              storage:
                type: "Property"
                value: 16
                unitCode:
                  type: "Property"
                  value: "GBA"
              adcResolution:
                type: "Property"
                value: 10
                unitCode:
                  type: "Property"
                  value: "bit"
              adcChannels:
                type: "Property"
                value: 6
              interfaces:
                type: "Property"
                value:
                  - "GPIO"
                  - "I2C"
                  - "SPI"
                  - "USB3.0"
                  - "Ethernet"
                  - "WiFi"
              powerInternal:
                type: "Property"
                value: 48
                unitCode:
                  type: "Property"
                  value: "Wh"
              powerExternalVoltage:
                type: "Property"
                value: 24
                unitCode:
                  type: "Property"
                  value: "V"
              operatingTemperatureMin:
                type: "Property"
                value: 0
                unitCode:
                  type: "Property"
                  value: "CEL"
              operatingTemperatureMax:
                type: "Property"
                value: 40
                unitCode:
                  type: "Property"
                  value: "CEL"

              hasDevices:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:AEPZTSensor:001"
                  - "urn:ngsi-ld:CrackGrowthSensor:0001"
              hasComponents:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SensorModule:shb1"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Platform:PortableDAQ-01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        inHPP:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
        controlledObservation:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        controlledActuation:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        deviceType:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
        relativePosition:
          type: object
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
      additionalProperties: false

    Microcontroller:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - Microcontroller
            microcontrollerType:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            processor:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            memory:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [GBA]
              additionalProperties: false
            storage:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [GBA]
              additionalProperties: false
            adcResolution:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: integer
                unitCode:
                  type: string
                  enum: [bit]
              additionalProperties: false
            adcChannels:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: integer
            interfaces:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: string
            powerInternal:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [Wh]
              additionalProperties: false
            powerExternalVoltage:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [V]
              additionalProperties: false
            operatingTemperatureMin:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CEL]
              additionalProperties: false
            operatingTemperatureMax:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CEL]
              additionalProperties: false
            hasDevices:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            hasComponents:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            isComponentOf:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of Microcontroller of Hydropower Plant Modeling
