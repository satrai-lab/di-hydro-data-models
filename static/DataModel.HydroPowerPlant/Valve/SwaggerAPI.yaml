openapi: 3.0.3
info:
  title: Valve Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Valve entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Valve entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Valve'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Valve:valve1"
              type: "Valve"
              name:
                type: "Property"
                value: "Main Penstock Gate Valve"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.496, 47.335]
              valveType:
                type: "Property"
                value: "Gate Valve"
              material:
                type: "Property"
                value: "Stainless Steel"
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              isPartOfValveHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:ValveHouse:vh1"
              isConnectedToPenstock:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Penstock:pen1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    Valve:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          required:
            - id
            - type
            - name
          properties:
    
            id:
              type: string
              format: uri
              description: Unique URI identifier for the Valve
    
            type:
              type: string
              enum:
                - Valve
              description: Fixed entity type identifier
    
            name:
              type: object
              description: Official or common name of the Valve
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
    
    
            geographicalLocation:
              type: object
              description: GeoJSON Point indicating the Valve’s location (longitude, latitude)
              properties:
                type:
                  type: string
                  enum:
                    - GeoProperty
                value:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Point
                    coordinates:
                      type: array
                      items:
                        type: number
                      minItems: 2
                      maxItems: 2
    
    
            valveType:
              type: object
              description: Classification or design of the Valve
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
                  enum:
                    - "Gate Valve"
                    - "Butterfly Valve"
                    - "Ball Valve"
                    - "Sluice Gate"
    
    
            material:
              type: object
              description: Construction material of the Valve
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
                  enum:
                    - "Stainless Steel"
                    - "Cast Iron"
                    - "Composite"
    
    
            isPartOfHydroPowerPlant:
              type: object
              description: Relationship to HydropowerPlant entities this Valve belongs to
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
            isPartOfValveHouse:
              type: object
              description: Relationship to ValveHouse entities that house this Valve
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
    
            isConnectedToPenstock:
              type: object
              description: Relationship to Penstock entities connected to this Valve
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
