openapi: 3.0.3
info:
  title: Camera Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Camera entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Camera entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Camera'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Camera:001"
              type: "Camera"

              name:
                type: "Property"
                value: "DHM Imaging Camera"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "sensor"

              model:
                type: "Property"
                value: "IDS U3-3990CP-M-GL_Rev_2_2"
              sensorResolution:
                type: "Property"
                value: [4512, 4512]
              pixelSize:
                type: "Property"
                value: 2.74
                unitCode:
                  type: "Property"
                  value: "UM"
              acquisitionSoftware:
                type: "Property"
                value: "IDS Peak"
              status:
                type: "Property"
                value: "operational"

              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:DHM:001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The human-readable name of the device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: Indicates whether this is a sensor, actuator, or both
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Camera:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - Camera
              description: NGSI-LD entity type. Must be Camera
            model:
              type: object
              description: Camera model
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            sensorResolution:
              type: object
              description: Maximum image resolution as [width, height]
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: integer
              additionalProperties: false
            pixelSize:
              type: object
              description: Size of each photosite
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: string
              additionalProperties: false
            acquisitionSoftware:
              type: object
              description: Software used for image capture
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            status:
              type: object
              description: Operational status of the camera
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            isComponentOf:
              type: object
              description: Reference to the DHM entity this camera feeds
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Camera of Hydropower Plant Modeling
