openapi: 3.0.3
info:
  title: Dam Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Dam entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Dam entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Dam'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Dam:dam1"
              type: "Dam"
              name:
                type: "Property"
                value: "Alpine Valley Dam"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.48, 47.32]
              damHeight:
                type: "Property"
                value: 85
                unitCode:
                  type: "Property"
                  value: "M"
              damLength:
                type: "Property"
                value: 320
                unitCode:
                  type: "Property"
                  value: "M"
              constructionMaterials:
                type: "Property"
                value: "Concrete"
              damType:
                type: "Property"
                value: "Concrete Gravity"
              yearOfConstruction:
                type: "Property"
                value: 1978
              damCrestElevation:
                type: "Property"
                value: 400
                unitCode:
                  type: "Property"
                  value: "M"
              reservoirWaterLevel:
                type: "Property"
                value: 390
                unitCode:
                  type: "Property"
                  value: "M"
              usefulWaterContent:
                type: "Property"
                value: 23000
                unitCode:
                  type: "Property"
                  value: "M3"
              energyContent:
                type: "Property"
                value: 180000
                unitCode:
                  type: "Property"
                  value: "MWH"
              specificConsumption:
                type: "Property"
                value: 0.12
                unitCode:
                  type: "Property"
                  value: "M3/KWH"
              lowerProductionLimit:
                type: "Property"
                value: 25
                unitCode:
                  type: "Property"
                  value: "M3S"
              upperProductionLimit:
                type: "Property"
                value: 150
                unitCode:
                  type: "Property"
                  value: "M3S"
              hasSpillway:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Spillway:sw1"
              hasintakes:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Intake:int1"
              isPartOfReservoir:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Reservoir:res1"
              isPartOfHydroPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number

    Dam:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
      type: object
      properties:
        type:
          type: string
          enum: [Dam]
        damHeight:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M] }

        damLength:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M] }

        damCrestElevation:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M] }

        reservoirWaterLevel:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M] }

        usefulWaterContent:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M3] }

        energyContent:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [MWH] }

        specificConsumption:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M3/KWH] }

        lowerProductionLimit:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M3S] }

        upperProductionLimit:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: number }
            unitCode:
              type: object
              properties:
                type: { type: string, enum: [Property] }
                value: { type: string, enum: [M3S] }

        constructionMaterials:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: string }

        damType:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: string, enum: [Concrete Gravity, Arch Dam, Embankment Dam] }

        yearOfConstruction:
          type: object
          properties:
            type: { type: string, enum: [Property] }
            value: { type: integer }

        hasSpillway:
          type: object
          properties:
            type: { type: string, enum: [Relationship] }
            object:
              type: array
              items: { type: string }

        hasintakes:
          type: object
          properties:
            type: { type: string, enum: [Relationship] }
            object:
              type: array
              items: { type: string }

        isPartOfReservoir:
          type: object
          properties:
            type: { type: string, enum: [Relationship] }
            object:
              type: array
              items: { type: string }

        isPartOfHydroPlant:
          type: object
          properties:
            type: { type: string, enum: [Relationship] }
            object:
              type: array
              items: { type: string }
