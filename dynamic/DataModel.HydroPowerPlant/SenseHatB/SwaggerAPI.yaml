openapi: 3.0.3
info:
  title: SenseHATB Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Sense HAT B entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a SenseHATB entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/SenseHATB"
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:SenseHATB:01"
              type: "SenseHATB"
              name:
                type: Property
                value: "Sense HAT B Multi-Sensor Board"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              controlledObservation:
                type: Property
                value:
                  - "Temperature"
                  - "Humidity"
                  - "Pressure"
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:Temp:1001"
                  - "urn:ngsi-ld:Observation:Hum:1002"
                  - "urn:ngsi-ld:Observation:Pres:1003"
              controlledActuation:
                type: Property
                value:
                  - "LED"
              actuations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Actuation:LED:2001"
              deviceType:
                type: Property
                value: "sensor"
              relativePosition:
                type: Point
                measurementUnit: "m"
                dimensions: "2D"
                coordinates:
                  - 12.3456
                  - 78.9012
                faces: []

              operatingVoltage:
                type: Property
                value: 3.3
                unitCode:
                  type: Property
                  value: "V"
              communicationInterface:
                type: Property
                value: "I2C"
              length:
                type: Property
                value: 65
                unitCode:
                  type: Property
                  value: "MMT"
              width:
                type: Property
                value: 36.5
                unitCode:
                  type: Property
                  value: "MMT"
              adcConversionResolution:
                type: Property
                value: 16
                unitCode:
                  type: Property
                  value: "bit"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Microcontroller:pi1"
              hasHumiditySensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:HumiditySensor:hs1"
              hasGyroscope:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Geroscope:g1"
              hasMagnetometer:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Magnetometer:m1"
              hasTemperatureSensor:
                type: Relationship
                object:
                  - "urn:ngsi-ld:TemperatureSensor:t1"
              hasConversion:
                type: Relationship
                object:
                  - "urn:ngsi-ld:ADCChip:adc1"
              hasBarometer:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Barometer:b1"
              hasAccelerometer:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Accelerometer:acc1"
      responses:
        "201":
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: The human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - "2D"
                - "3D"
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    SenseHATB:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this Sense HAT B board
            type:
              type: string
              enum:
                - SenseHATB
              description: NGSI-LD entity type. Must be SenseHATB
            operatingVoltage:
              type: object
              description: Supply voltage required by the board
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            communicationInterface:
              type: object
              description: Bus used to communicate with the host microcontroller
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            length:
              type: object
              description: Physical length of the board
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            width:
              type: object
              description: Physical width of the board
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            adcConversionResolution:
              type: object
              description: Resolution of the analogue-to-digital conversion chip
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: Host microcontroller that this board plugs into
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasHumiditySensor:
              type: object
              description: Reference to the onboard humidity sensor module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasGyroscope:
              type: object
              description: Reference to the onboard gyroscope module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasMagnetometer:
              type: object
              description: Reference to the onboard magnetometer module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasTemperatureSensor:
              type: object
              description: Reference to the onboard temperature sensor module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasConversion:
              type: object
              description: Reference to the onboard ADC conversion chip
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasBarometer:
              type: object
              description: Reference to the onboard barometric pressure sensor module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasAccelerometer:
              type: object
              description: Reference to the onboard accelerometer module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of SenseHATB of Hydropower Plant Modeling
