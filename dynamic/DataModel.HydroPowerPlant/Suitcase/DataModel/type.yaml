components:
  schemas:

    Suitcase:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/Suitcase/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this Suitcase entity"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - Suitcase
              description: "NGSI-LD entity type. Must be Suitcase"
              x-ngsi:
                type: Property

            dimensions:
              type: object
              description: "External case dimensions [length, width, height]"
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              x-ngsi:
                type: Property
              additionalProperties: false

            weight:
              type: object
              description: "Total system mass"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - KGM
              x-ngsi:
                type: Property
              additionalProperties: false

            powerSupply:
              type: object
              description: "On-board battery capacity"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - AHT
              x-ngsi:
                type: Property
              additionalProperties: false

            operatingTime:
              type: string
              description: "Maximum autonomous runtime"
              x-ngsi:
                type: Property

            connectivity:
              type: array
              description: "Data communication interfaces"
              items:
                type: string
              x-ngsi:
                type: Property

            display:
              type: string
              description: "Integrated human–machine interface"
              x-ngsi:
                type: Property

            protection:
              type: string
              description: "Environmental rating of the enclosure"
              x-ngsi:
                type: Property

            dataStorage:
              type: string
              description: "On-board data logging capacity"
              x-ngsi:
                type: Property

            hasTurbiditySensor:
              type: array
              description: "References to connected Turbidity Sensor modules"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            hasDhm:
              type: array
              description: "Reference to the onboard Digital Holographic Microscope (DHM) module"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            hasMicrocontroller:
              type: array
              description: "References to host microcontroller(s)"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            hasTlfSensor:
              type: array
              description: "References to connected Turbulence Flow Sensor(s)"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
