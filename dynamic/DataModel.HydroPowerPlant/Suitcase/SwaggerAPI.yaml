openapi: 3.0.3
info:
  title: Suitcase Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for portable multiparametric platform (Suitcase) entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Suitcase entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Suitcase'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Suitcase:01"
              type: "Suitcase"

              name:
                type: "Property"
                value: "Portable Multiparametric Platform"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "System"

              dimensions:
                type: "Property"
                value: [500, 400, 200]
                unitCode:
                  type: "Property"
                  value: "MMT"
              weight:
                type: "Property"
                value: 7
                unitCode:
                  type: "Property"
                  value: "KGM"
              powerSupply:
                type: "Property"
                value: 20
                unitCode:
                  type: "Property"
                  value: "V"
              operatingTime:
                type: "Property"
                value: "10 hours"
              connectivity:
                type: "Property"
                value:
                  - "Wi-Fi"
                  - "Bluetooth"
                  - "USB"
                  - "RS485"
              display:
                type: "Property"
                value: "Touchscreen"
              protection:
                type: "Property"
                value: "IP67"
              dataStorage:
                type: "Property"
                value: "1 month continuous"

              hasTurbiditySensor:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:TurbiditySensor:01"
              hasDhm:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:DHMModule:01"
              hasMicrocontroller:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Microcontroller:pi1"
              hasTlfSensor:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:TlfSensor:01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Suitcase:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - Suitcase
              description: NGSI-LD entity type. Must be Suitcase
            dimensions:
              type: object
              description: External case dimensions [length, width, height]
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            weight:
              type: object
              description: Total system mass
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - KGM
              additionalProperties: false
            powerSupply:
              type: object
              description: Nominal system power-supply voltage
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            operatingTime:
              type: object
              description: Maximum autonomous runtime
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            connectivity:
              type: object
              description: Data communication interfaces
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            display:
              type: object
              description: Integrated human–machine interface
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            protection:
              type: object
              description: Environmental rating of the enclosure
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            dataStorage:
              type: object
              description: On-board data logging capacity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            hasTurbiditySensor:
              type: object
              description: References to connected Turbidity Sensor modules
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasDhm:
              type: object
              description: Reference to the onboard Digital Holographic Microscope (DHM) module
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasMicrocontroller:
              type: object
              description: References to host microcontroller(s)
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasTlfSensor:
              type: object
              description: References to connected Turbulence Flow Sensor(s)
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Suitcase of Hydropower Plant Modeling
