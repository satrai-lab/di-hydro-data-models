openapi: 3.0.3
info:
  title: HydropowerPlant NGSI-LD API
  version: 1.0.0
  description: Complete API for hydropower plant management with all attributes
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a HydropowerPlant
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/HydropowerPlant'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              type: "HydropowerPlant"
              name: 
                type: "Property"
                value: "Alpine Mega Plant"
              geographicalLocation: 
                type: "GeoProperty"
                value: 
                  type: "Point"
                  coordinates: [-121.5, 47.3]
              address: 
                type: "Property"
                value: "123 Dam Road, Alpine Valley"
              size:
                type: "Property"
                value: "Large"
                min:
                  type : "Property"
                  value: 300
                  unitCode: "MW"
                max:
                  type: "Property"
                  value: 1000
                  unitCode: "MW"
                standard: 
                  type: "Property"
                  value: "IEC"
              installedCapacity:
                type: "Property"
                value: 750
                unitCode: "MW"
              powerPlantCapacity:
                type: "Property"
                value: 750
                unitCode: "MW"
              powerplantType:
                type: "Property"
                value: "storage/reservoir"
              conversionEfficiency:
                type: "Property"
                value: 92.5
              commissioningYear:
                type: "Property"
                value: 1985
              rehabilitationYear:
                type: "Property"
                value: 2018
              annualEnergyOutput:
                type: "Property"
                value: 4200000000
                unitCode: "KWH"
              ecologicalDischarge:
                type: "Property"
                value: 15.2
                unitCode: "M3/S"
              maxTailwaterLevel:
                type: "Property"
                value: 324.5
                unitCode: "M"
              grossHead:
                type: "Property"
                value: 186
                unitCode: "M"
              partOfCommunity:
                type: "Relationship"
                object: "urn:ngsi-ld:HydroPowerCommunity:comm-alpine-001"
              hasPressureTunnel:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PressureTunnel:pt1"
              boostedByPumpingStation:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PumpingStation:ps1"
              hasHydroPumps:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroPump:hp1"
              hasDams:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Dam:dam1"
              containsGenerators:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Generator:gen1"
              hasGovernors:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Governor:gov1"
              containsTurbines:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Turbine:turb1"
              hasIntakes:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Intake:int1"
              hasPowerHouses:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PowerHouse:ph1"
              hasPenstocks:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Penstock:pen1"
              hasValve:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Valve:valve1"
              hasValveHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:ValveHouse:vh1"
              hasWaterBody:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:WaterBody:river1"
              hasSurgeTank:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SurgeTank:st1"
              hasSpillway:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Spillway:sw1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    HydropowerPlant:
      type: object
      required: [ "@context", id, type, name ]
      properties:
        "@context":
          type: string
          description: NGSI-LD context file location
          example: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
        id:
          type: string
          description: Unique URI identifier following NGSI-LD pattern
          example: "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
        type:
          type: string
          enum: ["HydropowerPlant"]
          description: Fixed entity type identifier

        # Core Properties
        name:
          type : object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: ["GeoProperty"]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: ["Point"]
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
          required: [type, value]
        address:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
          required: [type, value]

        # Capacity
        size:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: string
            min:
              type: object
              properties:
                type:
                  type: string
                  enum: ["Property"]
                value:
                  type: number
                  description: Minimum capacity value
                unitCode:
                  type: string
                  enum: ["MW"]
            max:
              type: object
              properties:
                type:
                  type: string
                  enum: ["Property"]
                value:
                  type: number
                  description: Maximum capacity value
                unitCode:
                  type: string
                  enum: ["MW"]
            standard:
              type: string
              description: Standard classification for size
        installedCapacity:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["MW"]
        powerPlantCapacity:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["MW"]
        powerplantType:
          type: object
          description: Type of hydropower plant (e.g., run-of-river, storage/reservoir)
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - run-of-river
                - storage/reservoir
                - pumped-storage
                - Other
        conversionEfficiency:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
              description: Conversion efficiency percentage
            unitCode:
              type: string
              enum: ["%"]
        commissioningYear:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
              description: Year of initial commissioning
        rehabilitationYear:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
              description: Year of last rehabilitation or major upgrade
        annualEnergyOutput:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["KWH"]
          description: Annual energy output in kilowatt-hours
        ecologicalDischarge:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["M3/S"]
          description: Ecological discharge in cubic meters per second
        maxTailwaterLevel:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["M"]
          description: Maximum tailwater level in meters
        grossHead:
          type: object
          properties:
            type:
              type: string
              enum: ["Property"]
            value:
              type: number
            unitCode:
              type: string
              enum: ["M"]
          description: Gross head in meters
        # Relationships
        partOfCommunity:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: string
              format: uri
        hasPressureTunnel:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of pressure tunnels associated with the plant
        boostedByPumpingStation:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of pumping stations boosting the plant's operation
        hasHydroPumps:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of hydro pumps associated with the plant
        hasDams:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of dams associated with the plant
        containsGenerators:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of generators contained within the plant
        hasGovernors:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of governors controlling the plant's operation
        containsTurbines:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of turbines contained within the plant
        hasIntakes:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of intakes associated with the plant
        hasPowerHouses:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of power houses associated with the plant
        hasPenstocks:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of penstocks associated with the plant
        hasValve:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of valves associated with the plant
        hasValveHouse:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of valve houses associated with the plant
        hasWaterBody:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of water bodies associated with the plant
        hasSurgeTank:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of surge tanks associated with the plant
        hasSpillway:
          type: object
          properties:
            type:
              type: string
              enum: ["Relationship"]
            object:
              type: array
              items:
                type: string
                format: uri
          description: List of spillways associated with the plant

 
