openapi: 3.0.3
info:
  title: Microcontroller Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Microcontroller entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Microcontroller entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Microcontroller'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Microcontroller:pi1"
              type: "Microcontroller"
              name:
                type: "Property"
                value: "Raspberry Pi 3B+ Controller"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroTurbine:PenstockValve-01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              microcontrollerType:
                type: "Property"
                value: "RaspberryPi"
              processor:
                type: "Property"
                value: "Broadcom BCM2837"
              memory:
                type: "Property"
                value:
                  value: 1
                  unitCode: "GBA"
              storage:
                type: "Property"
                value:
                  value: 16
                  unitCode: "GBA"
              adcResolution:
                type: "Property"
                value:
                  value: 10
                  unitCode: "bit"
              adcChannels:
                type: "Property"
                value:
                  value: 6
                  unitCode: ""
              interfaces:
                type: "Property"
                value:
                  - GPIO
                  - I2C
                  - SPI
                  - USB3.0
                  - Ethernet
                  - WiFi
              powerInternal:
                type: "Property"
                value:
                  value: 48
                  unitCode: "Wh"
              powerExternalVoltage:
                type: "Property"
                value:
                  value: 24
                  unitCode: "V"
              operatingTemperatureMin:
                type: "Property"
                value:
                  value: 0
                  unitCode: "CEL"
              operatingTemperatureMax:
                type: "Property"
                value:
                  value: 40
                  unitCode: "CEL"
              hasDevices:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:AEPZTSensor:001"
                  - "urn:ngsi-ld:CrackGrowthSensor:0001"
              hasComponents:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SensorModule:shb1"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Platform:PortableDAQ-01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: The human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
        onObject:
          type: object
          description: Component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Microcontroller:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - Microcontroller
              description: NGSI-LD entity type. Must be Microcontroller
            microcontrollerType:
              type: object
              description: Role or family of this controller (what kind of board/CPU it is)
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            processor:
              type: object
              description: Name/model of the CPU or System-on-Chip
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            memory:
              type: object
              description: Installed RAM capacity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - GBA
              additionalProperties: false
            storage:
              type: object
              description: Local non-volatile storage size
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - GBA
              additionalProperties: false
            adcResolution:
              type: object
              description: Resolution of the on-board ADC used for analog sensor inputs
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            adcChannels:
              type: object
              description: Number of independent ADC input channels available
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - ""
              additionalProperties: false
            interfaces:
              type: object
              description: List of I/O and communication buses exposed by this controller
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: array
                  items:
                    type: string
            powerInternal:
              type: object
              description: Capacity of the internal battery pack
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - Wh
              additionalProperties: false
            powerExternalVoltage:
              type: object
              description: Nominal voltage of the external DC power input
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - V
              additionalProperties: false
            operatingTemperatureMin:
              type: object
              description: Minimum ambient temperature at which the controller is rated to operate
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            operatingTemperatureMax:
              type: object
              description: Maximum ambient temperature at which the controller is rated to operate
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            hasDevices:
              type: object
              description: References to all Device entities directly connected to this microcontroller
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasComponents:
              type: object
              description: References to component modules or sub-devices that this microcontroller hosts
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            isComponentOf:
              type: object
              description: References to higher-level systems or platforms that this microcontroller is part of
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Microcontroller of Hydropower Plant Modeling
