openapi: 3.0.3
info:
  title: Turbine NGSI-LD API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Turbine entities

servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Turbine entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Turbine'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Turbine:turb1"
              type: "Turbine"
              name: { type: "Property", value: "Alpine Francis Unit" }
              turbineType: { type: "Property", value: "Francis" }
              capacity: { type: "Property", value: 300, unitCode: { type: "Property", value: "MW" } }
              efficiency: { type: "Property", value: 92.1, unitCode: { type: "Property", value: "PCT" } }
              operatingFlowRate: { type: "Property", value: 250, unitCode: { type: "Property", value: "M3S" } }
              head: { type: "Property", value: 120, unitCode: { type: "Property", value: "M" } }
              manufacturer: { type: "Property", value: "HydroTurb Co." }
              yearOfInstallation: { type: "Property", value: 2010 }
              numberOfImpellers: { type: "Property", value: 15 }
              axis: { type: "Property", value: "vertical" }
              maxPower: { type: "Property", value: 350, unitCode: { type: "Property", value: "MW" } }
              speed: { type: "Property", value: 750, unitCode: { type: "Property", value: "RPM" } }
              typicalHeadRange: { type: "Property", value: [100, 140] }
              yearlyProduction: { type: "Property", value: 1150, unitCode: { type: "Property", value: "GWH" } }
              dischargesToReservoir:
                type: "Relationship"
                object:
                  - tunnelLength:
                      value: 2.5
                      unitCode: "KM"
                    object: "urn:ngsi-ld:Reservoir:res1"
                  - tunnelLength:
                      value: 3.2
                      unitCode: "KM"
                    object: "urn:ngsi-ld:Reservoir:res2"
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              drivesGenerators:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Generator:gen1"
              isPartOfPowerHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PowerHouse:ph1"
              controlledByGovernor:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Governor:gov1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    Turbine:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          required:
            - id
            - type
            - name
          properties:
            id:
              type: string
              format: uri
              description: Unique URI identifier for the Turbine
            type:
              type: string
              enum: [Turbine]
              description: Fixed entity type identifier
            name:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            turbineType:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                  enum: [Francis, Kaplan, Pelton, Other]
            capacity:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MW]
            efficiency:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [PCT]
            operatingFlowRate:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M3S]
            head:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M]
            manufacturer:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            yearOfInstallation:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: integer
            numberOfImpellers:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: integer
            axis:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                  enum: [horizontal, vertical]
            maxPower:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MW]
            speed:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [RPM]
            typicalHeadRange:
              type: object
              description: Typical operational head range of the turbine [min, max] in meters
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
            yearlyProduction:
              type: object
              description: Annual energy production by the turbine (GWh)
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [GWH]
            dischargesToReservoir:
              type: array
              items:
                type: object
                properties:
                  tunnelLength:
                    type: object
                    properties:
                      value:
                        type: number
                      unitCode:
                        type: string
                        enum: [KM]
                  object:
                    type: string
                    format: uri
            isPartOfHydroPowerPlant:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            drivesGenerators:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            isPartOfPowerHouse:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
            controlledByGovernor:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
