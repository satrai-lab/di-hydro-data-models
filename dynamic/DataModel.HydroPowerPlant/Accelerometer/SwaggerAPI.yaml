openapi: 3.0.3
info:
  title: Accelerometer Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for 3-Axis MEMS Accelerometer entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an Accelerometer entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Accelerometer'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Accelerometer:acc1"
              type: "Accelerometer"
              name:
                type: "Property"
                value: "Sense HAT B 3-Axis Accelerometer"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              axes:
                type: "Property"
                value:
                  value: 3
                  unitCode: ""
              measurementRanges:
                type: "Property"
                value:
                  value: [2, 4, 8, 16]
                  unitCode: "G"
              resolution:
                type: "Property"
                value:
                  value: 16
                  unitCode: "bit"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Acc:6001"
                  - "urn:ngsi-ld:Observation:Acc:6002"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          additionalProperties: false
        onObject:
          type: object
          description: Component(s) of the HPP this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: Indicates sensor, actuator, or both
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Accelerometer:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this accelerometer entity
            type:
              type: string
              enum:
                - Accelerometer
              description: NGSI-LD entity type. Must be Accelerometer
            axes:
              type: object
              description: Number of measurement axes
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - ""
              additionalProperties: false
            measurementRanges:
              type: object
              description: Supported acceleration measurement ranges
              properties:
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: string
                  enum:
                    - G
              additionalProperties: false
            resolution:
              type: object
              description: ADC conversion resolution
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: The Sense HAT B board this sensor belongs to
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            observations:
              type: object
              description: Observations produced by this accelerometer
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Accelerometer of Hydropower Plant Modeling
