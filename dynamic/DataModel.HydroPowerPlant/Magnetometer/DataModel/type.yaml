components:
  schemas:

    Magnetometer:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/Magnetometer/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this magnetometer entity"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - Magnetometer
              description: "NGSI-LD entity type. Must be Magnetometer"
              x-ngsi:
                type: Property

            axes:
              type: object
              description: "Number of measurement axes"
              properties:
                value:
                  type: integer
                  description: "Axes count"
                unitCode:
                  type: string
                  enum:
                    - ""
                  description: "No unit"
              x-ngsi:
                type: Property
              additionalProperties: false

            measuringRangeMin:
              type: object
              description: "Minimum magnetic flux density measurable"
              properties:
                value:
                  type: number
                  description: "Lower bound in Gauss"
                unitCode:
                  type: string
                  enum:
                    - GAU
                  description: "Unit code for Gauss"
              x-ngsi:
                type: Property
              additionalProperties: false

            measuringRangeMax:
              type: object
              description: "Maximum magnetic flux density measurable"
              properties:
                value:
                  type: number
                  description: "Upper bound in Gauss"
                unitCode:
                  type: string
                  enum:
                    - GAU
                  description: "Unit code for Gauss"
              x-ngsi:
                type: Property
              additionalProperties: false

            resolution:
              type: object
              description: "ADC conversion resolution"
              properties:
                value:
                  type: integer
                  description: "Resolution in bits"
                unitCode:
                  type: string
                  enum:
                    - bit
                  description: "Unit code for bits"
              x-ngsi:
                type: Property
              additionalProperties: false

            isComponentOf:
              type: array
              description: "The Sense HAT B board this sensor belongs to"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
