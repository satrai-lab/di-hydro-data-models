openapi: 3.0.3
info:
  title: Device Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for generic Device entities

servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Device entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Device'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Device:0001"
              type: "Device"
              name:
                type: "Property"
                value: "Generic Hydropower Device #1"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroTurbine:HT-123"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              controlledObservation:
                type: "Property"
                value:
                  - "Temperature"
                  - "Vibration"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Temp:1001"
                  - "urn:ngsi-ld:Observation:Vib:1002"
              controlledActuation:
                type: "Property"
                value:
                  - "ValveOpen"
                  - "ValveClose"
              actuations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Actuation:Valve:2001"
              deviceType:
                type: "Property"
                value: "sensorActuator"
              relativePosition:
                type: "Point"
                measurementUnit: "m"
                dimensions: "2D"
                coordinates:
                  - 12.3456
                  - 78.9012
                faces: []
              status:
                type: "Property"
                value: "normal"
              monitoringType:
                type: "Property"
                value: "StructuralHealthAndConditionMonitoring"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum: [Device]
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: Component(s) of the HPP this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: Hydropower plant this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: Observation entities produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: Actuation entities produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: Indicates the type of the device (sensor, actuator, both)
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false
        status:
          type: object
          description: The status of the device (e.g., normal or under maintenance)
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - normal
                - underMaintenance
          additionalProperties: false
        monitoringType:
          type: object
          description: Category of monitoring application for this sensor
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - StructuralHealthAndConditionMonitoring
                - EnvironmentalMonitoring
                - BiodiversityMonitoring
          additionalProperties: false
