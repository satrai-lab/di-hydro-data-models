openapi: 3.0.3
info:
  title: Temperature Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for temperature sensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a TemperatureSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/TemperatureSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:TemperatureSensor:t1"
              type: "TemperatureSensor"
              name:
                type: "Property"
                value: "Sense HAT B Band-Gap Diode Temperature Sensor"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              measuringRangeMin:
                type: "Property"
                value: -40
                unitCode: "CEL"
              measuringRangeMax:
                type: "Property"
                value: 85
                unitCode: "CEL"
              accuracy:
                type: "Property"
                value: 0.5
                unitCode: "CEL"
              resolution:
                type: "Property"
                value: 16
                unitCode: "bit"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Temp:5001"
                  - "urn:ngsi-ld:Observation:Temp:5002"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
        onObject:
          type: object
          description: Component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
        deviceType:
          type: object
          description: Indicates sensor, actuator, or both
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
      additionalProperties: false

    TemperatureSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this temperature sensor
            type:
              type: string
              enum:
                - TemperatureSensor
              description: NGSI-LD entity type. Must be TemperatureSensor
            measuringRangeMin:
              type: object
              description: Minimum temperature this sensor can report
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            measuringRangeMax:
              type: object
              description: Maximum temperature this sensor can report
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            accuracy:
              type: object
              description: Maximum deviation from true temperature
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            resolution:
              type: object
              description: ADC conversion resolution
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: The Sense HAT B board this sensor belongs to
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of TemperatureSensor of Hydropower Plant Modeling
