openapi: 3.0.3
info:
  title: Governor NGSI-LD API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Governor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Governor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Governor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Governor:gov1"
              type: "Governor"
              name:
                type: "Property"
                value: "Main Speed Governor"
              droopSetting:
                type: "Property"
                value: 5
                unitCode: 
                  type: "Property"
                  value: "PCT"
              speedSetPoint:
                type: "Property"
                value: 500
                unitCode: 
                  type: "Property"
                  value: "RPM"
              regulationRange:
                type: "Property"
                value: 10
                unitCode:   
                  type: "Property"
                  value: "PCT"
              responseTime:
                type: "Property"
                value: 0.5
                unitCode: 
                  type: "Property"
                  value: "S"
              manufacturer:
                type: "Property"
                value: "ControlTech Ltd"
              yearOfInstallation:
                type: "Property"
                value: 2017
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              controlsTurbine:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Turbine:turb1"
              isPartOfPowerHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:PowerHouse:ph1"
      responses:
        '201':
          description: Entity created successfully
components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    Governor:
      allOf:
        - $ref: "#/components/schemas/GenericStaticComponent"
        - type: object
          required:
            - id
            - type
            - name
          properties:
    
            id:
              type: string
              format: uri
              description: Unique URI identifier for the Governor
    
            type:
              type: string
              enum:
                - Governor
              description: Fixed entity type identifier
    
            name:
              type: object
              description: Official or common name of the Governor
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
    
            droopSetting:
              type: object
              description: Droop setting percentage indicating speed drop as load increases
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - PCT
    
            speedSetPoint:
              type: object
              description: Target operating speed of the turbine
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - RPM
    
            regulationRange:
              type: object
              description: Range over which the governor can adjust turbine input
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - PCT
    
            responseTime:
              type: object
              description: Time it takes for the governor to react to changes (in seconds)
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - S
    
    
            manufacturer:
              type: object
              description: Name or details of the governor’s manufacturer
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
    
    
            yearOfInstallation:
              type: object
              description: Year the governor was installed
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
    
    
            isPartOfHydroPowerPlant:
              type: object
              description: Relationship to parent HydropowerPlant entity
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
    
            controlsTurbine:
              type: object
              description: Relationship to Turbine entities controlled by this governor
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
    
            isPartOfPowerHouse:
              type: object
              description: Relationship to the PowerHouse entity housing this governor
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
