openapi: 3.0.3
info:
  title: CatchmentArea Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for CatchmentArea entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a CatchmentArea entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/CatchmentArea'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:CatchmentArea:ca1"
              type: "CatchmentArea"
              area:
                type: "Property"
                value: 1250
                unitCode:
                  type: "Property"
                  value: "KM2"
              annualPrecipitationVolume:
                type: "Property"
                value: 3500000000
                unitCode:
                  type: "Property"
                  value: "M3"
              seasonalRainfallDistribution:
                type: "Property"
                value: [0.3, 0.25, 0.2, 0.25]
              soilType:
                type: "Property"
                value: "Loam"
              vegetationCover:
                type: "Property"
                value: "Mixed forest and grassland"
              flowVariationProfile:
                type: "Property"
                value: [50, 60, 70, 80, 100, 120, 150, 140, 130, 100, 70, 55, 50]
                unitCode:
                  type: "Property"
                  value: "M3S"
              averageWaterFlow:
                type: "Property"
                value: 75
                unitCode:
                  type: "Property"
                  value: "M3S"
              suppliesWaterToWaterBody:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:WaterBody:river1"
                  - "urn:ngsi-ld:WaterBody:Res1"
              suppliesWaterToHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    CatchmentArea:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          properties:
            id:
              type: string
              format: uri
              description: Unique identifier of the CatchmentArea
            type:
              type: string
              enum: [CatchmentArea]
            area:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: string
                      enum: [KM2]
            annualPrecipitationVolume:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: string
                      enum: [M3]
            seasonalRainfallDistribution:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: number
            soilType:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            vegetationCover:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            flowVariationProfile:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: string
                      enum: [M3S]
            averageWaterFlow:
              type: object
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: string
                      enum: [M3S]
            suppliesWaterToWaterBody:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
            suppliesWaterToHydroPowerPlant:
              type: object
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
    
