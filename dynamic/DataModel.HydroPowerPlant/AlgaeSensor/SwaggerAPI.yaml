openapi: 3.0.3
info:
  title: Algae Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for AlgaeSensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an AlgaeSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/AlgaeSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:AlgaeSensor:001"
              type: "AlgaeSensor"
              name:
                type: Property
                value: "Reservoir Algae Monitor #1"
              onObject:
                type: Relationship
                object:
                  - "urn:ngsi-ld:HydroTurbine:HT-123"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: Property
                value: sensor
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:Algae:9001"
              model:
                type: Property
                value: "Modified ion selective membrane"
              linearRangeMin:
                type: Property
                value: 5
                unitCode:
                  type: Property
                  value: "UG_L"
              linearRangeMax:
                type: Property
                value: 300
                unitCode:
                  type: Property
                  value: "UG_L"
              totalRangeMin:
                type: Property
                value: 2
                unitCode:
                  type: Property
                  value: "UG_L"
              totalRangeMax:
                type: Property
                value: 500
                unitCode:
                  type: Property
                  value: "UG_L"
              resolution:
                type: Property
                value: 2
                unitCode:
                  type: Property
                  value: "UG_L"
              reactionTime:
                type: Property
                value: "<1 s"
              accuracy:
                type: Property
                value: "<±5 %"
                atTemperature:
                  type: Property
                  value: 20
                  unitCode:
                    type: Property
                    value: "CEL"
              communicationMode:
                type: Property
                value: "RS485 (Modbus RTU)"
              cableLength:
                type: Property
                value: 5
                unitCode:
                  type: Property
                  value: "MTR"
              operationalTempMin:
                type: Property
                value: 0
                unitCode:
                  type: Property
                  value: "CEL"
              operationalTempMax:
                type: Property
                value: 25
                unitCode:
                  type: Property
                  value: "CEL"
              dimensionsLength:
                type: Property
                value: 395
                unitCode:
                  type: Property
                  value: "MMT"
              dimensionsDiameter:
                type: Property
                value: 25
                unitCode:
                  type: Property
                  value: "MMT"
              protectionClass:
                type: Property
                value: "IP68"
              housingMaterial:
                type: Property
                value: "Stainless Steel + PVC"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Device:MPG-6099"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    AlgaeSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - AlgaeSensor
              description: Must be AlgaeSensor
            model:
              type: string
              description: Sensor model or sensing principle
            linearRangeMin:
              type: object
              description: Lower bound of the linear chlorophyll-a range
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - UG_L
              additionalProperties: false
            linearRangeMax:
              type: object
              description: Upper bound of the linear chlorophyll-a range
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - UG_L
              additionalProperties: false
            totalRangeMin:
              type: object
              description: Lower bound of the total chlorophyll-a range
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - UG_L
              additionalProperties: false
            totalRangeMax:
              type: object
              description: Upper bound of the total chlorophyll-a range
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - UG_L
              additionalProperties: false
            resolution:
              type: object
              description: Measurement granularity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - UG_L
              additionalProperties: false
            reactionTime:
              type: object
              description: Time to 90% response
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            accuracy:
              type: object
              description: Maximum deviation under standard conditions
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
                atTemperature:
                  type: object
                  description: Temperature at which accuracy is specified
                  properties:
                    type:
                      type: string
                      enum:
                        - Property
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum:
                        - CEL
                  additionalProperties: false
              additionalProperties: false
            communicationMode:
              type: object
              description: Digital interface protocol
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            cableLength:
              type: object
              description: Standard probe cable length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MTR
              additionalProperties: false
            operationalTempMin:
              type: object
              description: Minimum operating temperature
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            operationalTempMax:
              type: object
              description: Maximum operating temperature
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - CEL
              additionalProperties: false
            dimensionsLength:
              type: object
              description: Probe body length
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            dimensionsDiameter:
              type: object
              description: Probe body diameter
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MMT
              additionalProperties: false
            protectionClass:
              type: object
              description: Ingress protection rating
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            housingMaterial:
              type: object
              description: Wetted-part construction material
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
            isComponentOf:
              type: object
              description: Reference to the host MPG-6099 multi-parameter node
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
      description: Data Model of AlgaeSensor of Hydropower Plant Modeling
