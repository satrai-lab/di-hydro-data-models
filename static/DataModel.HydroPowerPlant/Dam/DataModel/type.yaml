---
components:
  schemas:

    Dam:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the Dam"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - Dam
          description: "NGSI Entity type. It has to be Dam"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The official or common name of the Dam"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the dam’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty

        damHeight:
          type: object
          description: "The vertical height from the dam’s foundation to its crest"
          properties:
            value:
              type: number
              description: "Height value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        damLength:
          type: object
          description: "The horizontal span or width of the dam"
          properties:
            value:
              type: number
              description: "Length value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        constructionMaterials:
          type: string
          enum:
            - "Concrete"
            - "Earth-fill"
            - "Rock-fill"
            - "Masonry"
          description: "The primary materials used in constructing the dam (e.g., concrete, earth-fill)"
          x-ngsi:
            type: Property

        damType:
          type: string
          description: "Structural design of the dam (e.g., ‘Concrete Gravity’, ‘Arch Dam’, ‘Embankment Dam’)"
          enum:
            - "Concrete Gravity"
            - "Arch Dam"
            - "Embankment Dam"
          x-ngsi:
            type: Property

        yearOfConstruction:
          type: number
          description: "The year the dam was built"
          x-ngsi:
            type: Property
        damCrestElevation:
          type: object
          description: "Elevation of the top of the dam above mean sea level (m)"
          properties:
            value:
              type: number
              description: "Crest elevation value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        
        hasSpillway:
          type: array
          description: "Array of references to the Spillway entity that is part of the dam's design to safely release excess water"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        
        hasintakes:
          type: array
          description: "Array of references to the intake entities that is part of the dam"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        isPartOfReservoir:
          type: array
          description: "Array of references to the Reservoir entity that is supplied by this dam"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
    
        isPartOfHydroPlant:
          type: array
          description: "Array of references to the HydropowerPlant entity that this dam is a component of"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/Dam/DataModel/type.json"


info:
  description: "Data Model of Dam for Hydropower Plant Modeling"
  title: HydropowerPlantModeling
  version: "1.0.2"
openapi: "3.0.3"
paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          content:
            application/ld+json:
              schema:
                type: object
          description: OK
