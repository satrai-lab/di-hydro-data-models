---
components:
  schemas:

    WaterBody:
      required:
        - id
        - type
        - name
      properties:
        id:
          anyOf: &anyof
            - description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
          format: uri
          type: string
          description: "Unique identifier of the WaterBody"
          x-ngsi:
            type: Property
        type:
          type: string
          enum:
            - WaterBody
          description: "NGSI Entity type. It has to be WaterBody"
          x-ngsi:
            type: Property
        name:
          type: string
          description: "The name of the WaterBody"
          x-ngsi:
            type: Property
        waterBodyCategory:
          type: string
          enum:
            - River
            - Lake
            - Reservoir
            - Other
          description: "Indicates whether the water body is a River, Lake, Reservoir, or Other"
          x-ngsi:
            type: Property
        geographicalLocation:
          type: object
          description: "GeoJSON property of type 'Point' representing the water body’s location. The first element in coordinates is longitude, and the second is latitude."
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
          x-ngsi:
            type: GeoProperty
        surfaceArea:
          type: object
          description: "Surface area of the water body"
          properties:
            value:
              type: number
              description: "Surface area value"
            unitCode:
              type: string
              enum:
                - "KM2"
              description: "UN/CEFACT unit code for square kilometer"
          x-ngsi:
            type: Property
        length:
          type: object
          description: "Length of the water body (applicable for rivers or elongated lakes)"
          properties:
            value:
              type: number
              description: "Length value"
            unitCode:
              type: string
              enum:
                - "KM"
              description: "UN/CEFACT unit code for kilometer"
          x-ngsi:
            type: Property
        averageDepth:
          type: object
          description: "Average depth of the water body"
          properties:
            value:
              type: number
              description: "Depth value in meters"
            unitCode:
              type: string
              enum:
                - "M"
              description: "UN/CEFACT unit code for meter"
          x-ngsi:
            type: Property
        averageFlowRate:
          type: object
          description: "Average flow rate"
          properties:
            value:
              type: number
              description: "Average flow rate value"
            unitCode:
              type: string
              enum:
                - "M3S"
              description: "UN/CEFACT unit code for cubic meters per second"
          x-ngsi:
            type: Property
        peakFlow:
          type: object
          description: "Peak flow rate"
          properties:
            value:
              type: number
              description: "Peak flow rate value"
            unitCode:
              type: string
              enum:
                - "M3S"
              description: "UN/CEFACT unit code for cubic meters per second"
          x-ngsi:
            type: Property
        seasonalVariation:
          type: object
          description: "Seasonal flow variation details"
          properties:
            winter:
              type: number
              description: "Winter flow rate"
            spring:
              type: number
              description: "Spring flow rate"
            summer:
              type: number
              description: "Summer flow rate"
            autumn:
              type: number
              description: "Autumn flow rate"
          x-ngsi:
            type: Property
        averageWaterLevel:
          type: object
          description: "Average water level"
          properties:
            value:
              type: number
            unitCode:
              type: string
              enum:
                - "M"
          x-ngsi:
            type: Property
        operationalData:
          type: object
          description: "Operational data such as flood risk and water rights"
          properties:
            floodRisk:
              type: string
              enum:
                - "Low"
                - "Medium"
                - "High"
              description: "Flood risk classification (e.g., Low, Medium, High)"
            waterRights:
              type: string
              enum:
                - "Public"
                - "Private"
                - "Mixed"
              description: "Information on water rights or allocation"
          x-ngsi:
            type: Property
        isFedBy:
          type: array
          description: "Array of references to the CatchmentArea entities that feed this water body"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
        isPartOfHydroPowerPlant:
          type: array
          description: "Array of references to the HydropowerPlant entities of which this water body is a part"
          items:
            type: string
            format: uri
          x-ngsi:
            type: Relationship
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

    Reservoir:
      allOf:
        - $ref: "#/components/schemas/WaterBody"
        - type: object
          properties:
            storageCapacity:
              type: object
              description: "Total volume of water that can be stored (in cubic meters)"
              properties:
                value:
                  type: number
                  description: "Storage capacity value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            averageInflowRate:
              type: object
              description: "Average inflow rate (in m³/s)"
              properties:
                value:
                  type: number
                  description: "Average inflow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            averageOutflowRate:
              type: object
              description: "Average outflow rate (in m³/s)"
              properties:
                value:
                  type: number
                  description: "Average outflow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            historicalMaxLevel:
              type: object
              description: "Historical maximum water level (in meters)"
              properties:
                value:
                  type: number
                  description: "Historical maximum water level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            historicalMinLevel:
              type: object
              description: "Historical minimum water level (in meters)"
              properties:
                value:
                  type: number
                  description: "Historical minimum water level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            maxReservoirLevel:
              type: object
              description: "Highest allowed water surface elevation in the reservoir (m above sea level)"
              properties:
                value:
                  type: number
                  description: "Maximum reservoir level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meters"
              x-ngsi:
                type: Property
            normalReservoirLevel:
              type: object
              description: "Usual operating water surface elevation in the reservoir (m above sea level)"
              properties:
                value:
                  type: number
                  description: "Normal reservoir level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meters"
              x-ngsi:
                type: Property
            reservoirLength:
              type: object
              description: "Distance the reservoir extends upstream from the dam at its normal level (km)"
              properties:
                value:
                  type: number
                  description: "Reservoir length value"
                unitCode:
                  type: string
                  enum:
                    - "KM"
                  description: "UN/CEFACT unit code for kilometers"
              x-ngsi:
                type: Property
            maximumEnergeticVolume:
              type: object
              description: "Total potential energy contained in the stored water when the reservoir is full (GWh)"
              properties:
                value:
                  type: number
                  description: "Maximum energetic volume value"
                unitCode:
                  type: string
                  enum:
                    - "GWH"
                  description: "UN/CEFACT unit code for gigawatt-hour"
              x-ngsi:
                type: Property
            reservoirType:
              type: string
              description: "Classification of reservoir operation (e.g., seasonal, weekly, daily)"
              enum:
                - "seasonal"
                - "weekly"
                - "daily"
              x-ngsi:
                type: Property
            grossVolume:
              type: object
              description: "Total storage capacity at normal level in that year (m³)"
              properties:
                value:
                  type: number
                  description: "Gross volume value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            usefulVolume:
              type: object
              description: "Usable storage capacity for power generation at normal level in that year (m³)"
              properties:
                value:
                  type: number
                  description: "Useful volume value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            hasPressureTunnel:
              type: array
              description: "Array of PressureTunnel entity identifiers"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            fedByPumpingStation:
              type: array
              description: "Array of PumpingStation entity identifiers"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            hasDams:
              type: array
              description: "Array of references to the dams of the reservoir"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            feedsIntakes:
              type: array
              description: "Array of references to the intakes that the reservoir feeds"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/types-defenitions.json#"

info:
  description: "Data Model of Reservoir for Hydropower Plant Modeling"
  title: HydropowerPlantModeling
  version: "1.0.2"
openapi: "3.0.3"
paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          content:
            application/ld+json:
              schema:
                type: object
          description: OK
