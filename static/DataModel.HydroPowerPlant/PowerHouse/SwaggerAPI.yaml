openapi: 3.0.3
info:
  title: PowerHouse NGSI-LD API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for PowerHouse entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a PowerHouse entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/PowerHouse'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:PowerHouse:ph1"
              type: "PowerHouse"
              name:
                type: "Property"
                value: "Alpine Main PowerHouse"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.5, 47.31]
              address:
                type: "Property"
                value: "456 Generator Ave, Alpine Valley"
              buildingArea:
                type: "Property"
                value: 1200
                unitCode: "M2"
              numberOfFloors:
                type: "Property"
                value: 2
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              containsGenerators:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Generator:gen1"
                  - "urn:ngsi-ld:Generator:gen2"
              containsTurbines:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Turbine:turb1"
                  - "urn:ngsi-ld:Turbine:turb2"
              isConnectedToPenstock:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Penstock:pen1"
                  - "urn:ngsi-ld:Penstock:pen2"
              hasGovernors:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Governor:gov1"
                  - "urn:ngsi-ld:Governor:gov2"
      responses:
        '201':
          description: Entity created successfully
components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    PowerHouse:
      allOf:
      - $ref: '#/components/schemas/GenericStaticComponent'
      - type: object
        required:
          - id
          - type
          - name
        properties:

          id:
            type: string
            format: uri
            description: Unique URI identifier for the PowerHouse

          type:
            type: string
            enum:
              - PowerHouse
            description: Fixed entity type identifier

          name:
            type: object
            description: Official or common name of the PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Property
              value:
                type: string

          geographicalLocation:
            type: object
            description: GeoJSON Point location of the PowerHouse (longitude, latitude)
            properties:
              type:
                type: string
                enum:
                  - GeoProperty
              value:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - Point
                  coordinates:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2

          address:
            type: object
            description: Physical street address of the PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Property
              value:
                type: string

          buildingArea:
            type: object
            description: Total floor area of the PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Property
              value:
                type: number
              unitCode:
                type: string
                enum:
                  - M2

          numberOfFloors:
            type: object
            description: Number of stories within the PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Property
              value:
                type: integer

          isPartOfHydroPowerPlant:
            type: object
            description: Relationship to parent HydropowerPlant entity
            properties:
              type:
                type: string
                enum:
                  - Relationship
              object:
                type: array
                items:
                  type: string
                  format: uri

          containsGenerators:
            type: object
            description: Relationship to Generator entities contained in this PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Relationship
              object:
                type: array
                items:
                  type: string
                  format: uri

          containsTurbines:
            type: object
            description: Relationship to Turbine entities contained in this PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Relationship
              object:
                type: array
                items:
                  type: string
                  format: uri

          isConnectedToPenstock:
            type: object
            description: Relationship to Penstock entities delivering water here
            properties:
              type:
                type: string
                enum:
                  - Relationship
              object:
                type: array
                items:
                  type: string
                  format: uri

          hasGovernors:
            type: object
            description: Relationship to Governor entities present in this PowerHouse
            properties:
              type:
                type: string
                enum:
                  - Relationship
              object:
                type: array
                items:
                  type: string
                format: uri
 
