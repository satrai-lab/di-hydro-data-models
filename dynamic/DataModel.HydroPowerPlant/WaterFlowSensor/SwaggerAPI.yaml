openapi: 3.0.3
info:
  title: WaterFlowSensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for WaterFlowSensor entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a WaterFlowSensor entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/WaterFlowSensor'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:WaterFlowSensor:001"
              type: "WaterFlowSensor"
              name:
                type: "Property"
                value: "River Flow Sensor 1"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Bridge:Bridge-01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:Flow:1001"
              measurementType:
                type: "Property"
                value: "remote"
              waterHeightAccuracy:
                type: "Property"
                value: 0.01
                unitCode:
                  type: "Property"
                  value: "CM"
              imagingComponents:
                type: "Property"
                value:
                  - "LiDAR"
                  - "infrared"
                  - "thermal"
              communication:
                type: "Property"
                value: "3G/4G mobile"
              powerSource:
                type: "Property"
                value:
                  - "battery"
                  - "solarPanel"
              realTimeAlerts:
                type: "Property"
                value: "yes"
              fieldOfView:
                type: "Property"
                value: 130
                unitCode:
                  type: "Property"
                  value: "DEG"
              dataOutputs:
                type: "Property"
                value:
                  - "hydrology"
                  - "images"
                  - "videos"
              installationRequirements:
                type: "Property"
                value: "Mounted above water under a bridge"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    WaterFlowSensor:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - WaterFlowSensor
              description: NGSI-LD entity type. Must be WaterFlowSensor
            measurementType:
              type: object
              description: Measurement modality (e.g., remote sensing)
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
            waterHeightAccuracy:
              type: object
              description: Accuracy of water height measurement
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [CM]
              additionalProperties: false
            imagingComponents:
              type: object
              description: Onboard imaging sensors
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            communication:
              type: object
              description: Data transmission interface
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            powerSource:
              type: object
              description: Power supply methods
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            realTimeAlerts:
              type: object
              description: Alert capability
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            fieldOfView:
              type: object
              description: Sensor field of view angle
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [DEG]
              additionalProperties: false
            dataOutputs:
              type: object
              description: Types of data produced
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            installationRequirements:
              type: object
              description: Mounting instructions
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
      description: Data Model of WaterFlowSensor of Hydropower Plant Modeling
