openapi: 3.0.3
info:
  title: Magnetometer Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for 3-Axis MEMS Magnetometer entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Magnetometer entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Magnetometer'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:Magnetometer:m1"
              type: "Magnetometer"
              name:
                type: Property
                value: "Sense HAT B 3-Axis Magnetometer"
              inHPP:
                type: Relationship
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              axes:
                type: Property
                value: 3
              measuringRangeMin:
                type: Property
                value: -49.12
                unitCode:
                  type: Property
                  value: "GAU"
              measuringRangeMax:
                type: Property
                value: 49.12
                unitCode:
                  type: Property
                  value: "GAU"
              resolution:
                type: Property
                value: 16
                unitCode:
                  type: Property
                  value: "bit"
              isComponentOf:
                type: Relationship
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
              observations:
                type: Relationship
                object:
                  - "urn:ngsi-ld:Observation:Mag:4001"
                  - "urn:ngsi-ld:Observation:Mag:4002"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          additionalProperties: false
        onObject:
          type: object
          description: Component(s) of the HPP this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: HydropowerPlant this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: Indicates sensor, actuator, or both
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Magnetometer:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this magnetometer entity
            type:
              type: string
              enum:
                - Magnetometer
              description: NGSI-LD entity type. Must be Magnetometer
            axes:
              type: object
              description: Number of measurement axes
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
              additionalProperties: false
            measuringRangeMin:
              type: object
              description: Minimum magnetic flux density measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - GAU
              additionalProperties: false
            measuringRangeMax:
              type: object
              description: Maximum magnetic flux density measurable
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - GAU
              additionalProperties: false
            resolution:
              type: object
              description: ADC conversion resolution
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: The Sense HAT B board this sensor belongs to
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            observations:
              type: object
              description: Observations produced by this magnetometer
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Magnetometer of Hydropower Plant Modeling
