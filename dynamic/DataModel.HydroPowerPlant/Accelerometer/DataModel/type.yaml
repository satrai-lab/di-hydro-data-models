components:
  schemas:

    Accelerometer:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/Accelerometer/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this accelerometer entity"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - Accelerometer
              description: "NGSI-LD entity type. Must be Accelerometer"
              x-ngsi:
                type: Property

            axes:
              type: object
              description: "Number of measurement axes"
              properties:
                value:
                  type: integer
                  description: "Axes count"
                unitCode:
                  type: string
                  enum:
                    - ""
                  description: "No unit"
              x-ngsi:
                type: Property
              additionalProperties: false

            measurementRanges:
              type: object
              description: "Supported acceleration measurement ranges"
              properties:
                value:
                  type: array
                  items:
                    type: number
                  description: "List of supported ranges"
                unitCode:
                  type: string
                  enum:
                    - G
                  description: "Unit code for g"
              x-ngsi:
                type: Property
              additionalProperties: false

            resolution:
              type: object
              description: "ADC conversion resolution"
              properties:
                value:
                  type: integer
                  description: "Resolution in bits"
                unitCode:
                  type: string
                  enum:
                    - bit
                  description: "Unit code for bits"
              x-ngsi:
                type: Property
              additionalProperties: false

            isComponentOf:
              type: array
              description: "The Sense HAT B board this sensor belongs to"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
