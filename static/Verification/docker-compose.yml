version: "3.8"

services:
  mongo:
    image: mongo:4.4
    container_name: mongo-orion-ld
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  orion-ld:
    image: fiware/orion-ld:latest
    container_name: orion-ld-broker
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      LOG_LEVEL: INFO
    command: >
      -dbhost mongo

volumes:
  mongo_data:
