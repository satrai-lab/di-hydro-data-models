openapi: 3.0.3
info:
  title: Penstock Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Penstock entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Penstock entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Penstock'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:Penstock:pen1"
              type: "Penstock"
              name:
                type: "Property"
                value: "Main Alpine Penstock"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.495, 47.34]
              length:
                type: "Property"
                value: 1200
                unitCode: "M"
              diameter:
                type: "Property"
                value: 4.5
                unitCode: "M"
              material:
                type: "Property"
                value: "Steel"
              designPressure:
                type: "Property"
                value: 50
                unitCode: "BAR"
              flowCapacity:
                type: "Property"
                value: 200
                unitCode: "M3S"
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
              isConnectedToIntake:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Intake:int1"
              isConnectedToSurgeTank:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SurgeTank:st1"
              isConnectedToValve:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Valve:valve1"
              isConnectedToValveHouse:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:ValveHouse:vh1"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Penstock:
      type: object
      required:
        - id
        - type
        - name
      properties:

        id:
          type: string
          format: uri
          description: Unique URI identifier for the Penstock
          example: "urn:ngsi-ld:Penstock:pen1"

        type:
          type: string
          enum:
            - Penstock
          description: Fixed entity type identifier
          example: "Penstock"

        name:
          type: object
          description: Official or common name of the Penstock
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          example:
            type: "Property"
            value: "Main Alpine Penstock"

        geographicalLocation:
          type: object
          description: GeoJSON Point marking the penstock’s start location (longitude, latitude)
          properties:
            type:
              type: string
              enum:
                - GeoProperty
            value:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - Point
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
          example:
            type: "GeoProperty"
            value:
              type: "Point"
              coordinates: [-121.495, 47.34]

        length:
          type: object
          description: Physical length of the penstock
          properties:
            type:
              type: string
              enum:
                - Property
            value:
                type: number
            unitCode:
                type: string
                enum:
                    - M
          example:
            type: "Property"
            value: 1200
            unitCode: "M"

        diameter:
          type: object
          description: Internal diameter of the penstock
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 4.5
            unitCode: "M"

        material:
          type: object
          description: Construction material of the penstock
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - Steel
                - "Reinforced Concrete"
                - Composite
          example:
            type: "Property"
            value: "Steel"

        designPressure:
          type: object
          description: Maximum hydraulic pressure the penstock is engineered to withstand
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - BAR
          example:
            type: "Property"
            value: 50
            unitCode: "BAR"

        flowCapacity:
          type: object
          description: Designed maximum flow capacity to the turbine
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 200
            unitCode: "M3S"

        isPartOfHydroPowerPlant:
          type: object
          description: Relationship to parent HydropowerPlant entity
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"

        isConnectedToIntake:
          type: object
          description: Relationship to Intake entity feeding this penstock
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:Intake:int1"

        isConnectedToSurgeTank:
          type: object
          description: Relationship to SurgeTank entity mitigating pressure transients
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:SurgeTank:st1"

        isConnectedToValve:
          type: object
          description: Relationship to Valve entity installed on this penstock
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:Valve:valve1"

        isConnectedToValveHouse:
          type: object
          description: Relationship to ValveHouse entity housing valves for this penstock
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object:
              - "urn:ngsi-ld:ValveHouse:vh1"
