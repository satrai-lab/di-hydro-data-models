openapi: 3.0.3
info:
  title: DHM Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Digital Holographic Microscope (DHM) entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a DHM entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/DHM'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:DHM:001"
              type: "DHM"
              name:
                type: "Property"
                value: "Digital Holographic Microscope #1"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "sensor"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:DHM:9001"
              laserSource:
                type: "Property"
                value: "Cobolt Samba™"
                waveLength:
                  type: "Property"
                  value: 532
                  unitCode:
                    type: "Property"
                    value: "NM"
              beamExpander:
                type: "Property"
                value: 10
                unitCode:
                  type: "Property"
                  value: "C62"
              microscopeObjective:
                type: "Property"
                value: "Olympus PLN10XCY"
                magnification:
                  type: "Property"
                  value: 60
                  unitCode:
                    type: "Property"
                    value: "C62"
              resolutionAchieved:
                type: "Property"
                value: 228.1
                unitCode:
                  type: "Property"
                  value: "MM"
              interferencePattern:
                type: "Property"
                value: 1.85
                unitCode:
                  type: "Property"
                  value: "UM"
              status:
                type: "Property"
                value: "operational"
              hasCamera:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Camera:cam1"
              hasMicrocontroller:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Microcontroller:pi1"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Suitcase:01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: Human-readable name of the device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: Component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
        observations:
          type: object
          description: Observations produced by or connected to this device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
        actuations:
          type: object
          description: Actuations produced by or connected to this device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
        deviceType:
          type: object
          description: "Indicates type of device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
      additionalProperties: false

    DHM:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - DHM
              description: NGSI-LD entity type. Must be DHM
            laserSource:
              type: object
              description: Laser source details
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                waveLength:
                  type: object
                  description: Emitted wavelength
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum: [NM]
                  additionalProperties: false
              additionalProperties: false
            beamExpander:
              type: object
              description: Beam expander magnification factor
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [C62]
              additionalProperties: false
            microscopeObjective:
              type: object
              description: Objective lens details
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                magnification:
                  type: object
                  description: Objective magnification
                  properties:
                    type:
                      type: string
                      enum: [Property]
                    value:
                      type: number
                    unitCode:
                      type: string
                      enum: [C62]
                  additionalProperties: false
              additionalProperties: false
            resolutionAchieved:
              type: object
              description: Lateral resolution achieved
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [MM]
              additionalProperties: false
            interferencePattern:
              type: object
              description: Fringe spacing in interference patterns
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [UM]
              additionalProperties: false
            status:
              type: object
              description: Operational status
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
              additionalProperties: false
            hasCamera:
              type: object
              description: Reference to associated camera module
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            hasMicrocontroller:
              type: object
              description: Reference to host microcontroller
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
            isComponentOf:
              type: object
              description: Reference to Suitcase platform this DHM belongs to
              properties:
                type:
                  type: string
                  enum: [Relationship]
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of DHM of Hydropower Plant Modeling
