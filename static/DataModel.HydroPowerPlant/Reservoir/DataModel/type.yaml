components:
  schemas:

    Reservoir:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/Reservoir/DataModel/type.json"

      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/WaterBody/DataModel/type.yaml#/components/schemas/WaterBody"
        - type: object
          properties:
            storageCapacity:
              type: object
              description: "Total volume of water that can be stored (in cubic meters)"
              properties:
                value:
                  type: number
                  description: "Storage capacity value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            averageInflowRate:
              type: object
              description: "Average inflow rate (in m³/s)"
              properties:
                value:
                  type: number
                  description: "Average inflow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            averageOutflowRate:
              type: object
              description: "Average outflow rate (in m³/s)"
              properties:
                value:
                  type: number
                  description: "Average outflow rate value"
                unitCode:
                  type: string
                  enum:
                    - "M3S"
                  description: "UN/CEFACT unit code for cubic meters per second"
              x-ngsi:
                type: Property
            historicalMaxLevel:
              type: object
              description: "Historical maximum water level (in meters)"
              properties:
                value:
                  type: number
                  description: "Historical maximum water level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            historicalMinLevel:
              type: object
              description: "Historical minimum water level (in meters)"
              properties:
                value:
                  type: number
                  description: "Historical minimum water level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            maxReservoirLevel:
              type: object
              description: "Highest allowed water surface elevation in the reservoir (m above sea level)"
              properties:
                value:
                  type: number
                  description: "Maximum reservoir level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meters"
              x-ngsi:
                type: Property
            normalReservoirLevel:
              type: object
              description: "Usual operating water surface elevation in the reservoir (m above sea level)"
              properties:
                value:
                  type: number
                  description: "Normal reservoir level value"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meters"
              x-ngsi:
                type: Property
            reservoirLength:
              type: object
              description: "Distance the reservoir extends upstream from the dam at its normal level (km)"
              properties:
                value:
                  type: number
                  description: "Reservoir length value"
                unitCode:
                  type: string
                  enum:
                    - "KM"
                  description: "UN/CEFACT unit code for kilometers"
              x-ngsi:
                type: Property
            maximumEnergeticVolume:
              type: object
              description: "Total potential energy contained in the stored water when the reservoir is full (GWh)"
              properties:
                value:
                  type: number
                  description: "Maximum energetic volume value"
                unitCode:
                  type: string
                  enum:
                    - "GWH"
                  description: "UN/CEFACT unit code for gigawatt-hour"
              x-ngsi:
                type: Property
            reservoirType:
              type: string
              description: "Classification of reservoir operation (e.g., seasonal, weekly, daily)"
              enum:
                - "seasonal"
                - "weekly"
                - "daily"
              x-ngsi:
                type: Property
            grossVolume:
              type: object
              description: "Total storage capacity at normal level in that year (m³)"
              properties:
                value:
                  type: number
                  description: "Gross volume value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            usefulVolume:
              type: object
              description: "Usable storage capacity for power generation at normal level in that year (m³)"
              properties:
                value:
                  type: number
                  description: "Useful volume value"
                unitCode:
                  type: string
                  enum:
                    - "M3"
                  description: "UN/CEFACT unit code for cubic meter"
              x-ngsi:
                type: Property
            hasPressureTunnel:
              type: array
              description: "Array of PressureTunnel entity identifiers"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            fedByPumpingStation:
              type: array
              description: "Array of PumpingStation entity identifiers"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            hasDams:
              type: array
              description: "Array of references to the dams of the reservoir"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            feedsIntakes:
              type: array
              description: "Array of references to the intakes that the reservoir feeds"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship


