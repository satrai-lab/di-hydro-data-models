openapi: 3.0.3
info:
  title: AESystem Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for AE system entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an AESystem entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/AESystem'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:AESystem:01"
              type: "AESystem"
              frequencyBandwidthMin:
                type: "Property"
                value: 10
                unitCode: "kHz"
              frequencyBandwidthMax:
                type: "Property"
                value: 400
                unitCode: "kHz"
              acquisitionMode:
                type: "Property"
                value: "Timed and Continuous"
              samplingRate:
                type: "Property"
                value: 2000000
                unitCode: "1/s"
              systemNoise:
                type: "Property"
                value: 30
                unitCode: "dB"
              samplingLength:
                type: "Property"
                value: 15000
                unitCode: "count"
              analogueFilterMin:
                type: "Property"
                value: 30
                unitCode: "kHz"
              analogueFilterMax:
                type: "Property"
                value: 175
                unitCode: "kHz"
              digitalFilterMin:
                type: "Property"
                value: 80
                unitCode: "kHz"
              digitalFilterMax:
                type: "Property"
                value: 400
                unitCode: "kHz"
              dataOutput:
                type: "Property"
                value: "Amplitude,RMS,Energy,ASL"
              temperatureMin:
                type: "Property"
                value: -20
                unitCode: "CEL"
              temperatureMax:
                type: "Property"
                value: 60
                unitCode: "CEL"
              powerSupply:
                type: "Property"
                value: 8.4
                unitCode: "V"
              powerMode:
                type: "Property"
                value: "External or Battery"
              chargingVoltage:
                type: "Property"
                value: 8.4
                unitCode: "V"
              operatingVoltage:
                type: "Property"
                value: 7.2
                unitCode: "V"
              sleepModeCurrent:
                type: "Property"
                value: 0.2
                unitCode: "mA"
              hasComponent:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:AEPZTSensor:001"
              observations:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Observation:obsAE001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
          required:
            - type
            - value
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          required:
            - type
            - object
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          required:
            - type
            - object
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          required:
            - type
            - value
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          required:
            - type
            - object
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          required:
            - type
            - value
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          required:
            - type
            - object
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          required:
            - type
            - value
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    AESystem:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required:
            - id
            - type
          properties:
            type:
              type: string
              enum:
                - AESystem
              description: Fixed entity type
            frequencyBandwidthMin:
              type: object
              description: Minimum frequency bandwidth the system can capture
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [kHz]
              required:
                - type
                - value
                - unitCode
            frequencyBandwidthMax:
              type: object
              description: Maximum frequency bandwidth the system can capture
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [kHz]
              required:
                - type
                - value
                - unitCode
            acquisitionMode:
              type: object
              description: Supported acquisition modes
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: string
                  enum:
                    - Timed
                    - Continuous
                    - Timed and Continuous
              required:
                - type
                - value
            samplingRate:
              type: object
              description: Maximum ADC sampling rate
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["1/s"]
              required:
                - type
                - value
                - unitCode
            systemNoise:
              type: object
              description: System self-noise level
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [dB]
              required:
                - type
                - value
                - unitCode
            samplingLength:
              type: object
              description: Maximum number of samples per hit
              properties:
                type:
                  type: string
                  enum: [Property]
                value:
                  type: integer
                unitCode:
                  type: string
                  enum: [count]
              required:
                - type
                - value
                - unitCode
            analogueFilterMin:
              type: object
              description: Lower cutoff frequency of the analog filter
              properties:
                type:
                  type: string
                  enum: [Property]
