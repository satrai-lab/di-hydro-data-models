components:
  schemas:
    Dam:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/DataModel.HydroPowerPlant/Dam/DataModel/type.json"
      allOf:
        - $ref: "#/components/schemas/GenericStaticComponent"
        - type: object
          required:
            - id
            - type
            - name
          properties:
            id:
              description: "Property. Identifier format of any NGSI entity"
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
              format: uri
              x-ngsi:
                type: Property
            type:
              type: string
              enum:
                - Dam
              description: "NGSI Entity type. It has to be Dam"
              x-ngsi:
                type: Property
            name:
              type: string
              description: "The official or common name of the Dam"
              x-ngsi:
                type: Property
            geographicalLocation:
              type: object
              description: "GeoJSON property of type 'Point' representing the dam’s location. The first element in coordinates is longitude, and the second is latitude."
              properties:
                type:
                  type: string
                  enum:
                    - Point
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
              x-ngsi:
                type: GeoProperty

            damHeight:
              type: object
              description: "The vertical height from the dam’s foundation to its crest"
              properties:
                value:
                  type: number
                  description: "Height value in meters"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            
            damLength:
              type: object
              description: "The horizontal span or width of the dam"
              properties:
                value:
                  type: number
                  description: "Length value in meters"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property
            
            constructionMaterials:
              type: string
              enum:
                - "Concrete"
                - "Earth-fill"
                - "Rock-fill"
                - "Masonry"
              description: "The primary materials used in constructing the dam (e.g., concrete, earth-fill)"
              x-ngsi:
                type: Property

            damType:
              type: string
              description: "Structural design of the dam (e.g., ‘Concrete Gravity’, ‘Arch Dam’, ‘Embankment Dam’)"
              enum:
                - "Concrete Gravity"
                - "Arch Dam"
                - "Embankment Dam"
              x-ngsi:
                type: Property
            
            yearOfConstruction:
              type: number
              description: "The year the dam was built"
              x-ngsi:
                type: Property
            damCrestElevation:
              type: object
              description: "Elevation of the top of the dam above mean sea level (m)"
              properties:
                value:
                  type: number
                  description: "Crest elevation value in meters"
                unitCode:
                  type: string
                  enum:
                    - "M"
                  description: "UN/CEFACT unit code for meter"
              x-ngsi:
                type: Property

            reservoirWaterLevel:
              type: object
              description: "Measured or estimated water surface elevation in the reservoir (meters above sea level)"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: [M]
              x-ngsi:
                type: Property
            
            usefulWaterContent:
              type: object
              description: "Effective usable water volume in the reservoir for power generation"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["M3"]
              x-ngsi:
                type: Property
            
            energyContent:
              type: object
              description: "Estimated energy content in the reservoir based on head and volume"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["MWH"]
              x-ngsi:
                type: Property
            
            specificConsumption:
              type: object
              description: "Volume of water required to generate one kilowatt-hour of electricity"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["M3KWH"]
              x-ngsi:
                type: Property
            
            lowerProductionLimit:
              type: object
              description: "Minimum water level or flow required for turbine operation"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["M3S"]
              x-ngsi:
                type: Property
            
            upperProductionLimit:
              type: object
              description: "Maximum production rate or turbine limit under technical constraints"
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum: ["M3S"]
              x-ngsi:
                type: Property
            
            
            hasSpillway:
              type: array
              description: "Array of references to the Spillway entity that is part of the dam's design to safely release excess water"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
            
            hasintakes:
              type: array
              description: "Array of references to the intake entities that is part of the dam"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
    
            isPartOfReservoir:
              type: array
              description: "Array of references to the Reservoir entity that is supplied by this dam"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
  
            isPartOfHydroPlant:
              type: array
              description: "Array of references to the HydropowerPlant entity that this dam is a component of"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          
    
