components:
  schemas:

    Generator:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/Generator/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/static/DataModel.HydroPowerPlant/GenericStaticComponent/DataModel/type.yaml#/components/schemas/GenericStaticComponent"
        - type: object

          required:
            - id
            - type
            - name

          properties:

            id:
              description: "Property. Unique identifier of the Generator entity (NGSI-LD URI format)."
              maxLength: 256
              minLength: 1
              pattern: "^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$"
              type: string
              format: uri
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - Generator
              description: "NGSI-LD entity type. Must be 'Generator'."
              x-ngsi:
                type: Property

            name:
              type: string
              description: "Official or common name of the Generator."
              x-ngsi:
                type: Property

            generatorType:
              type: string
              enum:
                - "Synchronous"
                - "Asynchronous"
                - "DC"
                - "PermanentMagnet"
              description: "Technical type of the generator based on its electrical operation principle."
              x-ngsi:
                type: Property

            generatorModel:
              type: string
              description: "Specific commercial or manufacturer model designation of the generator."
              x-ngsi:
                type: Property

            ratedCapacity:
              type: object
              description: "Rated electrical capacity of the generator under normal operating conditions (MW)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "MW"
              x-ngsi:
                type: Property

            efficiency:
              type: object
              description: "Conversion efficiency of the generator, expressed as a percentage."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "PCT"
              x-ngsi:
                type: Property

            manufacturer:
              type: string
              description: "Manufacturer or supplier of the generator."
              x-ngsi:
                type: Property

            yearOfInstallation:
              type: number
              description: "Year when the generator was installed."
              x-ngsi:
                type: Property

            voltageLevel:
              type: object
              description: "Nominal voltage output of the generator (kV)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "KV"
              x-ngsi:
                type: Property

            ratedOutputMVA:
              type: object
              description: "Nominal apparent power capacity under standard conditions (MVA)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "MVA"
              x-ngsi:
                type: Property

            connectionToGrid:
              type: object
              description: "Voltage level of connection between generator and electrical grid (kV)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "KV"
              x-ngsi:
                type: Property

            transformersQuantity:
              type: integer
              description: "Number of transformers connected to this generator."
              x-ngsi:
                type: Property

            transformersApparentPower:
              type: object
              description: "Total apparent power capacity of connected transformers (MVA)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "MVA"
              x-ngsi:
                type: Property

            industrialControlSystem:
              type: string
              description: "Details of the industrial control system (e.g., SCADA, PLC) managing this generator."
              x-ngsi:
                type: Property

            speed:
              type: object
              description: "Rotational speed of the generator shaft (RPM)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "RPM"
              x-ngsi:
                type: Property

            ratedPowerFactor:
              type: number
              description: "Ratio of real power to apparent power (unitless)."
              x-ngsi:
                type: Property

            voltageRegulationRange:
              type: object
              description: "Allowable variation above or below nominal voltage (%)."
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - "PCT"
              x-ngsi:
                type: Property

            windingInsulationClass:
              type: string
              description: "Insulation temperature rating class of the generator windings."
              x-ngsi:
                type: Property

            # Relationships
            isPartOfHydroPowerPlant:
              type: array
              description: "References to HydropowerPlant entities that include this generator."
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            isDrivenByTurbines:
              type: array
              description: "References to Turbine entities that mechanically drive this generator."
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            hasTransformers:
              type: array
              description: "References to Transformer entities connected to this generator."
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            isPartOfPowerHouse:
              type: array
              description: "References to PowerHouse entities that house this generator."
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship
