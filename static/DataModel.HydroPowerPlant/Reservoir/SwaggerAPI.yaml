openapi: 3.0.3
info:
  title: Reservoir Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for Reservoir (a specialized WaterBody) entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a Reservoir entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Reservoir'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:WaterBody:res1"
              type: "WaterBody"
              name:
                type: "Property"
                value: "Alpine Storage Reservoir"
              waterBodyCategory:
                type: "Property"
                value: "Reservoir"
              geographicalLocation:
                type: "GeoProperty"
                value:
                  type: "Point"
                  coordinates: [-121.52, 47.36]
              surfaceArea:
                type: "Property"
                value: 25.4
                unitCode: "KM2"
              length:
                type: "Property"
                value: 12
                unitCode: "KM"
              averageDepth:
                type: "Property"
                value: 45
                unitCode: "M"
              averageFlowRate:
                type: "Property"
                value: 350
                unitCode: "M3S"
              peakFlow:
                type: "Property"
                value: 620
                unitCode: "M3S"
              seasonalVariation:
                type: "Property"
                value:
                  winter: 300
                  spring: 550
                  summer: 480
                  autumn: 400
              averageWaterLevel:
                type: "Property"
                value: 400
                unitCode: "M"
              operationalData:
                type: "Property"
                value:
                  floodRisk: "Medium"
                  waterRights: "Mixed"
              storageCapacity:
                type: "Property"
                value: 180000000
                unitCode: "M3"
              averageInflowRate:
                type: "Property"
                value: 350
                unitCode: "M3S"
              averageOutflowRate:
                type: "Property"
                value: 300
                unitCode: "M3S"
              historicalMaxLevel:
                type: "Property"
                value: 412
                unitCode: "M"
              historicalMinLevel:
                type: "Property"
                value: 392
                unitCode: "M"
              maxReservoirLevel:
                type: "Property"
                value: 420
                unitCode: "M"
              normalReservoirLevel:
                type: "Property"
                value: 400
                unitCode: "M"
              reservoirLength:
                type: "Property"
                value: 15
                unitCode: "KM"
              maximumEnergeticVolume:
                type: "Property"
                value: 2.8
                unitCode: "GWH"
              reservoirType:
                type: "Property"
                value: "seasonal"
              grossVolume:
                type: "Property"
                value: 180000000
                unitCode: "M3"
              usefulVolume:
                type: "Property"
                value: 160000000
                unitCode: "M3"
              isFedBy:
                type: "Relationship"
                object: ["urn:ngsi-ld:CatchmentArea:ca1"]
              isPartOfHydroPowerPlant:
                type: "Relationship"
                object: ["urn:ngsi-ld:HydropowerPlant:plant-alpine-001"]
              hasDams:
                type: "Relationship"
                object: ["urn:ngsi-ld:Dam:dam1"]
              feedsIntakes:
                type: "Relationship"
                object: ["urn:ngsi-ld:Intake:int1"]
              hasPressureTunnel:
                type: "Relationship"
                object: ["urn:ngsi-ld:PressureTunnel:pt1"]
              fedByPumpingStation:
                type: "Relationship"
                object: ["urn:ngsi-ld:PumpingStation:ps1"]
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Reservoir:
      type: object
      required:
        - id
        - type
        - name
        - waterBodyCategory
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier for the reservoir
          example: "urn:ngsi-ld:WaterBody:res1"
        type:
          type: string
          enum:
            - WaterBody
          description: Fixed entity type identifier
          example: "WaterBody"
        name:
          type: object
          description: Official name of the reservoir
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
          example:
            type: "Property"
            value: "Alpine Storage Reservoir"
        waterBodyCategory:
          type: object
          description: Classification of the water body
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - River
                - Lake
                - Reservoir
                - Other
          example:
            type: "Property"
            value: "Reservoir"
        geographicalLocation:
          type: object
          description: GeoJSON point for reservoir location
          properties:
            type:
              type: string
              enum:
                - GeoProperty
            value:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - Point
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
          example:
            type: "GeoProperty"
            value:
              type: "Point"
              coordinates: [-121.52, 47.36]
        surfaceArea:
          type: object
          description: Reservoir surface area
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - KM2
          example:
            type: "Property"
            value: 25.4
            unitCode: "KM2"
        length:
          type: object
          description: Upstream length from dam
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - KM
          example:
            type: "Property"
            value: 12
            unitCode: "KM"
        averageDepth:
          type: object
          description: Mean reservoir depth
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 45
            unitCode: "M"
        averageFlowRate:
          type: object
          description: Mean inflow/outflow rate
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 350
            unitCode: "M3S"
        peakFlow:
          type: object
          description: Maximum flow rate
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 620
            unitCode: "M3S"
        seasonalVariation:
          type: object
          description: Seasonal flow variation
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: object
              properties:
                winter:
                  type: number
                spring:
                  type: number
                summer:
                  type: number
                autumn:
                  type: number
          example:
            type: "Property"
            value:
              winter: 300
              spring: 550
              summer: 480
              autumn: 400
        averageWaterLevel:
          type: object
          description: Mean water‐surface elevation
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 400
            unitCode: "M"
        operationalData:
          type: object
          description: Flood risk and water rights
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: object
              properties:
                floodRisk:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High
                waterRights:
                  type: string
                  enum:
                    - Public
                    - Private
                    - Mixed
          example:
            type: "Property"
            value:
              floodRisk: "Medium"
              waterRights: "Mixed"
        storageCapacity:
          type: object
          description: Total volume stored
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3
          example:
            type: "Property"
            value: 180000000
            unitCode: "M3"
        averageInflowRate:
          type: object
          description: Mean inflow rate
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 350
            unitCode: "M3S"
        averageOutflowRate:
          type: object
          description: Mean outflow rate
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3S
          example:
            type: "Property"
            value: 300
            unitCode: "M3S"
        historicalMaxLevel:
          type: object
          description: Historical maximum level
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 412
            unitCode: "M"
        historicalMinLevel:
          type: object
          description: Historical minimum level
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 392
            unitCode: "M"
        maxReservoirLevel:
          type: object
          description: Maximum allowed elevation
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 420
            unitCode: "M"
        normalReservoirLevel:
          type: object
          description: Typical operating elevation
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M
          example:
            type: "Property"
            value: 400
            unitCode: "M"
        reservoirLength:
          type: object
          description: Upstream extent length
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - KM
          example:
            type: "Property"
            value: 15
            unitCode: "KM"
        maximumEnergeticVolume:
          type: object
          description: Potential energy at full pool
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - GWH
          example:
            type: "Property"
            value: 2.8
            unitCode: "GWH"
        reservoirType:
          type: object
          description: Operation classification
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - seasonal
                - weekly
                - daily
          example:
            type: "Property"
            value: "seasonal"
        grossVolume:
          type: object
          description: Annual gross storage capacity
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3
          example:
            type: "Property"
            value: 180000000
            unitCode: "M3"
        usefulVolume:
          type: object
          description: Annual usable storage capacity
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: number
            unitCode:
              type: string
              enum:
                - M3
          example:
            type: "Property"
            value: 160000000
            unitCode: "M3"
        isFedBy:
          type: object
          description: Upstream catchment references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:CatchmentArea:ca1"]
        isPartOfHydroPowerPlant:
          type: object
          description: HydropowerPlant references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:HydropowerPlant:plant-alpine-001"]
        hasDams:
          type: object
          description: Dam references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:Dam:dam1"]
        feedsIntakes:
          type: object
          description: Intake references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:Intake:int1"]
        hasPressureTunnel:
          type: object
          description: PressureTunnel references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:PressureTunnel:pt1"]
        fedByPumpingStation:
          type: object
          description: PumpingStation references
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          example:
            type: "Relationship"
            object: ["urn:ngsi-ld:PumpingStation:ps1"]
