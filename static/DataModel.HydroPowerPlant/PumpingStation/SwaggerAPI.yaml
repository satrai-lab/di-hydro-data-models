openapi: 3.0.3
info:
  title: PumpingStation Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for PumpingStation entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json

paths:
  /entities:
    post:
      summary: Create a PumpingStation entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/PumpingStation'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/main/static/context.json"
              id: "urn:ngsi-ld:PumpingStation:ps1"
              type: "PumpingStation"
              name:
                type: "Property"
                value: "Alpine Peak Pumping Station"
              totalPower:
                type: "Property"
                value: 300
                unitCode: 
                  type: "Property"
                  value: "MW"
              unitCount:
                type: "Property"
                value: 4
              yearlyEnergyConsumption:
                type: "Property"
                value: 1200000000
                unitCode: 
                  type: "Property"
                  value: "KWH"
              estimatedAnnualContribution:
                type: "Property"
                value: 8000000
                unitCode: 
                  type: "Property"
                  value: "MWH"
              feedsReservoir:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:Reservoir:res1"
              increasesProductionAt:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydropowerPlant:plant-alpine-001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    GenericStaticComponent:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier
        type:
          type: string
        name:
          type: object
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        geographicalLocation:
          type: object
          properties:
            type:
              type: string
              enum: [GeoProperty]
            value:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
        isPartOfHydroPowerPlant:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        hasDevices:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        observations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
        actuations:
          type: object
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string

    PumpingStation:
      allOf:
        - $ref: '#/components/schemas/GenericStaticComponent'
        - type: object
          required:
            - id
            - type
            - name
          properties:
    
            id:
              type: string
              format: uri
              description: Unique URI identifier for the PumpingStation
    
            type:
              type: string
              enum:
                - PumpingStation
              description: Fixed entity type identifier
    
            name:
              type: object
              description: Official name of the pumping station
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
    
            totalPower:
              type: object
              description: Total installed motor power capacity
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MW
    
            unitCount:
              type: object
              description: Number of individual pump units
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: integer
    
            yearlyEnergyConsumption:
              type: object
              description: Annual electricity consumed by all pumps
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - KWH
    
            estimatedAnnualContribution:
              type: object
              description: Estimated additional hydropower generation enabled by pumping
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - MWH
    
            feedsReservoir:
              type: object
              description: References to Reservoir entities this station pumps into
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
    
            increasesProductionAt:
              type: object
              description: References to HydropowerPlant entities whose generation is boosted by this station
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
