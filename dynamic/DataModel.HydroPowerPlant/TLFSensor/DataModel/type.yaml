components:
  schemas:

    TlfSensor:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/TlfSensor/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique URI identifier of this TLF sensor entity"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - TlfSensor
              description: "NGSI-LD entity type. Must be TlfSensor"
              x-ngsi:
                type: Property

            hasMicrocontroller:
              type: array
              description: "Reference to the host microcontroller driving this sensor"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

            isComponentOf:
              type: array
              description: "Reference to the Suitcase platform that this sensor belongs to"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
