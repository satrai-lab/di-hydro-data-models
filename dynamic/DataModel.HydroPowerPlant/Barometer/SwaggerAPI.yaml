openapi: 3.0.3
info:
  title: Barometer Sensor Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for barometric pressure sensor entities  
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create a Barometer entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Barometer'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:BarometerSensor:b1"
              type: "Barometer"
              name:
                type: "Property"
                value: "Sense HAT B Barometric Pressure Sensor"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              measuringRangeMin:
                type: "Property"
                value: 260
                unitCode: "hPa"
              measuringRangeMax:
                type: "Property"
                value: 1260
                unitCode: "hPa"
              accuracy:
                type: "Property"
                value: 0.025
                unitCode: "hPa"
              resolution:
                type: "Property"
                value: 24
                unitCode: "bit"
              isComponentOf:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:SenseHATB:01"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          enum:
            - Device
          description: NGSI-LD entity type. Must be Device
        name:
          type: object
          description: The human-readable name of the device
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
        onObject:
          type: object
          description: Components of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: Observation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: Observations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: Actuation types this device can control
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: Actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum:
                - Relationship
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: Indicates whether this is a sensor, actuator, or both
          properties:
            type:
              type: string
              enum:
                - Property
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative 2D/3D position of the device
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum:
                - 2D
                - 3D
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    Barometer:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            id:
              type: string
              format: uri
              pattern: '^[\\w\\-\\.\\{\\}\\$\\+\\*\\[\\]`|~^@!,:\\\\]+$'
              description: Unique identifier of this barometric pressure sensor
            type:
              type: string
              enum:
                - Barometer
              description: NGSI-LD entity type. Must be Barometer
            measuringRangeMin:
              type: object
              description: Minimum pressure this sensor can measure
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - hPa
              additionalProperties: false
            measuringRangeMax:
              type: object
              description: Maximum pressure this sensor can measure
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - hPa
              additionalProperties: false
            accuracy:
              type: object
              description: Maximum pressure error
              properties:
                value:
                  type: number
                unitCode:
                  type: string
                  enum:
                    - hPa
              additionalProperties: false
            resolution:
              type: object
              description: ADC conversion resolution
              properties:
                value:
                  type: integer
                unitCode:
                  type: string
                  enum:
                    - bit
              additionalProperties: false
            isComponentOf:
              type: object
              description: The Sense HAT B board that this sensor is part of
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of Barometer of Hydropower Plant Modeling
