openapi: 3.0.3
info:
  title: Ultrasonic Transducer Interactive API
  version: 1.0.0
  description: Interactive NGSI-LD API with attribute-level documentation for UltrasonicTransducer entities
servers:
  - url: https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json

paths:
  /entities:
    post:
      summary: Create an UltrasonicTransducer entity
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              $ref: '#/components/schemas/UltrasonicTransducer'
            example:
              "@context": "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/context.json"
              id: "urn:ngsi-ld:UltrasonicTransducer:001"
              type: "UltrasonicTransducer"
              name:
                type: "Property"
                value: "UTX-40PZ Ultrasonic Transducer"
              onObject:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:HydroTurbine:Penstock:01"
              inHPP:
                type: "Relationship"
                object: "urn:ngsi-ld:HydropowerPlant:Plant-XYZ"
              deviceType:
                type: "Property"
                value: "sensor"
              status:
                type: "Property"
                value: "receiving_signal"
              model:
                type: "Property"
                value: "UTX-40PZ"
              manufacturer:
                type: "Property"
                value: "PiezoWave Technologies"
              resonantFrequency:
                type: "Property"
                value: 40
                unitCode:
                  type: "Property"
                  value: "kHz"
              powerRating:
                type: "Property"
                value: 50
                unitCode:
                  type: "Property"
                  value: "W"
              material:
                type: "Property"
                value: "Piezoelectric ceramic"
              mountType:
                type: "Property"
                value: "adhesive"
              diameter:
                type: "Property"
                value: 25
                unitCode:
                  type: "Property"
                  value: "MMT"
              thickness:
                type: "Property"
                value: 5
                unitCode:
                  type: "Property"
                  value: "MMT"
              protectionGrade:
                type: "Property"
                value: "IP68"
              controlledBy:
                type: "Relationship"
                object:
                  - "urn:ngsi-ld:UltrasonicGenerator:001"
      responses:
        '201':
          description: Entity created successfully

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
          description: Unique URI identifier of the entity
        type:
          type: string
          description: NGSI-LD entity type
        name:
          type: object
          description: The name of the Device
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
        onObject:
          type: object
          description: The component(s) of the HPP that this device is installed on
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        inHPP:
          type: object
          description: The HydropowerPlant that this device belongs to
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: string
              format: uri
          additionalProperties: false
        controlledObservation:
          type: object
          description: The observation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        observations:
          type: object
          description: List of IDs of the observations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        controlledActuation:
          type: object
          description: The actuation types this device can control
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: array
              items:
                type: string
          additionalProperties: false
        actuations:
          type: object
          description: List of IDs of the actuations produced by or connected to the device
          properties:
            type:
              type: string
              enum: [Relationship]
            object:
              type: array
              items:
                type: string
                format: uri
          additionalProperties: false
        deviceType:
          type: object
          description: "Indicates the type of the device: sensor, actuator, or both"
          properties:
            type:
              type: string
              enum: [Property]
            value:
              type: string
              enum:
                - sensor
                - actuator
                - sensorActuator
                - Device
                - System
          additionalProperties: false
        relativePosition:
          type: object
          description: Relative position of the device in 2D/3D space
          properties:
            type:
              type: string
              enum:
                - Point
                - LineString
                - MultiLineString
                - Polygon
                - Trimesh
            measurementUnit:
              type: string
            dimensions:
              type: string
              enum: [2D, 3D]
            coordinates:
              type: array
              items: {}
            faces:
              type: array
              items: {}
          additionalProperties: false

    UltrasonicTransducer:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UltrasonicTransducer
              description: NGSI-LD entity type. Must be UltrasonicTransducer
            status:
              type: object
              description: Operational status of the transducer
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            model:
              type: object
              description: Device model identifier
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            manufacturer:
              type: object
              description: Manufacturer name
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            resonantFrequency:
              type: object
              description: Resonant frequency in kHz
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Property
                    value:
                      type: string
                      enum:
                        - kHz
              additionalProperties: false
            powerRating:
              type: object
              description: Power handling in watts
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Property
                    value:
                      type: string
                      enum:
                        - W
              additionalProperties: false
            material:
              type: object
              description: Construction material
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            mountType:
              type: object
              description: Mounting method
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            diameter:
              type: object
              description: Transducer diameter
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Property
                    value:
                      type: string
                      enum:
                        - MMT
              additionalProperties: false
            thickness:
              type: object
              description: Transducer thickness
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: number
                unitCode:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Property
                    value:
                      type: string
                      enum:
                        - MMT
              additionalProperties: false
            protectionGrade:
              type: object
              description: Waterproof rating
              properties:
                type:
                  type: string
                  enum:
                    - Property
                value:
                  type: string
              additionalProperties: false
            controlledBy:
              type: object
              description: References to the ultrasonic generator controlling this transducer
              properties:
                type:
                  type: string
                  enum:
                    - Relationship
                object:
                  type: array
                  items:
                    type: string
                    format: uri
              additionalProperties: false
      description: Data Model of UltrasonicTransducer of Hydropower Plant Modeling
