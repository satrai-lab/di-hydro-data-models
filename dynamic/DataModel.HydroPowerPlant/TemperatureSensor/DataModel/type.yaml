components:
  schemas:

    TemperatureSensor:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/TemperatureSensor/DataModel/type.json"
      allOf:
        - $ref: "https://raw.githubusercontent.com/satrai-lab/di-hydro-data-models/refs/heads/main/dynamic/DataModel.HydroPowerPlant/GenericDevice/DataModel/type.yaml#/components/schemas/Device"
        - type: object
          properties:

            id:
              type: string
              format: uri
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              description: "Unique identifier of this temperature sensor"
              x-ngsi:
                type: Property

            type:
              type: string
              enum:
                - TemperatureSensor
              description: "NGSI-LD entity type. Must be TemperatureSensor"
              x-ngsi:
                type: Property

            measuringRangeMin:
              type: object
              description: "Minimum temperature this sensor can report"
              properties:
                value:
                  type: number
                  description: "Lower bound in °C"
                unitCode:
                  type: string
                  enum:
                    - CEL
                  description: "Unit code for degrees Celsius"
              x-ngsi:
                type: Property
              additionalProperties: false

            measuringRangeMax:
              type: object
              description: "Maximum temperature this sensor can report"
              properties:
                value:
                  type: number
                  description: "Upper bound in °C"
                unitCode:
                  type: string
                  enum:
                    - CEL
                  description: "Unit code for degrees Celsius"
              x-ngsi:
                type: Property
              additionalProperties: false

            accuracy:
              type: object
              description: "Maximum deviation from true temperature"
              properties:
                value:
                  type: number
                  description: "Accuracy in °C"
                unitCode:
                  type: string
                  enum:
                    - CEL
                  description: "Unit code for degrees Celsius"
              x-ngsi:
                type: Property
              additionalProperties: false

            resolution:
              type: object
              description: "ADC conversion resolution"
              properties:
                value:
                  type: integer
                  description: "Resolution in bits"
                unitCode:
                  type: string
                  enum:
                    - bit
                  description: "Unit code for bits"
              x-ngsi:
                type: Property
              additionalProperties: false

            isComponentOf:
              type: array
              description: "The Sense HAT B board this sensor belongs to"
              items:
                type: string
                format: uri
              x-ngsi:
                type: Relationship

          additionalProperties: false
